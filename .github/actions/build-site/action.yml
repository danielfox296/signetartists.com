name: Build site
description: Build the site from content/ and stage it, with the repo's static files, in _site, then check it.

inputs:
  install-args:
    description: Extra arguments for npm ci
    default: ""

runs:
  using: composite
  steps:
    - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
      with:
        node-version-file: .nvmrc
        cache: npm
        cache-dependency-path: site/package-lock.json

    - name: Install
      shell: bash
      env:
        INSTALL_ARGS: ${{ inputs.install-args }}
      run: npm ci --prefix site $INSTALL_ARGS

    # The pictures' WebP copies, the recompressed JPEGs and the YouTube
    # pictures are made here, never committed. The cache keeps them between
    # runs, so a run makes only what is new, and is saved again only when
    # something was made.
    - name: Restore pictures
      uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: ~/.cache/signet-pictures
        key: pictures-v1-${{ github.run_id }}-${{ github.run_attempt }}
        restore-keys: pictures-v1-

    - name: No internal notes in content
      shell: bash
      run: python3 scripts/no_notes.py

    - name: Build site
      id: build
      shell: bash
      run: node site/scripts/build.mjs --out _gen --images ~/.cache/signet-pictures

    - name: Save pictures
      if: steps.build.outputs.pictures_made != '0'
      uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: ~/.cache/signet-pictures
        key: pictures-v1-${{ github.run_id }}-${{ github.run_attempt }}

    # The repo's static files (styles, scripts, images, fonts), then the
    # build's output over them. rsync rather than a hand-picked cp list, so
    # a new output directory is never silently left out.
    - name: Stage site
      shell: bash
      run: |
        mkdir -p _site
        rsync -a \
          --exclude='.git' \
          --exclude='.github' \
          --exclude='_site' \
          --exclude='_gen' \
          --exclude='/site' \
          --exclude='/content' \
          --exclude='*.md' \
          --exclude='.gitignore' \
          --exclude='.nvmrc' \
          --exclude='__pycache__' \
          --exclude='node_modules' \
          --exclude='scripts' \
          ./ _site/
        rsync -a _gen/ _site/

    # The checks, on what is about to be served. nav_lint: the header, menu,
    # footer, crumbs, /sitemap/ and placeholders. site_check: titles,
    # descriptions, share images, picture descriptions and the structured
    # data. Either one failing stops the run.
    - name: Check site
      shell: bash
      run: |
        python3 scripts/nav_lint.py _site
        python3 site/scripts/site_check.py _site

    # The copy check reads the built pages against the word list. It warns and
    # never stops a run.
    - name: Check copy
      shell: bash
      run: python3 scripts/copy_check.py _site
