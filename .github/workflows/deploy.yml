name: Deploy signetartists.com

# Builds main with the new build (site/, from content/) and deploys it to
# GitHub Pages. The stage puts the build's output over the repo's static
# files, so a page deleted from content/ is gone from the site too.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      # Full history: a page's sitemap <lastmod> is its file's last commit.
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0

      # BEFORE build/deploy — after the deploy the live sitemaps already equal
      # the new ones, so a post-deploy fetch would always diff empty. This
      # snapshot (both sitemaps, one file) is what makes the changed-only
      # IndexNow ping meaningful; the watch pages live in video-sitemap.xml.
      - name: Snapshot live sitemaps (IndexNow baseline)
        run: |
          : > /tmp/live-sitemap.xml
          for f in sitemap.xml video-sitemap.xml; do
            curl -fsS --max-time 30 "https://signetartists.com/$f" >> /tmp/live-sitemap.xml \
              || echo "live $f unavailable — IndexNow will submit its URLs"
          done

      # Setup, install, build, stage and check: the steps staging shares.
      - name: Build site
        uses: ./.github/actions/build-site
        with:
          install-args: --omit=dev

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3.0.1
        with:
          path: _site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4.0.5

      # Tell IndexNow-participating engines (Bing, etc.) what changed — only
      # URLs new or lastmod-moved vs the pre-deploy snapshot; skips the ping
      # when nothing did. The script swallows its own errors, so a dead
      # endpoint never fails a deploy. It reads both built sitemaps.
      - name: Ping IndexNow (changed URLs only)
        working-directory: _site
        run: python3 ../scripts/indexnow.py --baseline /tmp/live-sitemap.xml
