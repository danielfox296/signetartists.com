name: Deploy signetartists.com

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # BEFORE build/deploy — after the deploy the live sitemap already equals
      # the new one, so a post-deploy fetch would always diff empty. This
      # snapshot is what makes the changed-only IndexNow ping meaningful.
      - name: Snapshot live sitemap (IndexNow baseline)
        run: |
          curl -fsS --max-time 30 https://signetartists.com/sitemap.xml \
            -o /tmp/live-sitemap.xml \
            || echo "live sitemap unavailable — IndexNow will submit all URLs"

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build site
        run: python3 build.py

      - name: Stage site
        run: |
          mkdir -p _site
          # rsync rather than a hand-picked cp list, so a new output directory
          # is never silently left out of a deploy.
          rsync -a \
            --exclude='.git' \
            --exclude='.github' \
            --exclude='_src' \
            --exclude='_site' \
            --exclude='build.py' \
            --exclude='README.md' \
            --exclude='__pycache__' \
            --exclude='scripts' \
            ./ _site/

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

      # Tell IndexNow-participating engines (Bing, etc.) what changed — only
      # URLs new or lastmod-moved vs the pre-deploy snapshot; skips the ping
      # when nothing did. The script swallows its own errors, so a dead
      # endpoint never fails a deploy.
      - name: Ping IndexNow (changed URLs only)
        run: python3 scripts/indexnow.py --baseline /tmp/live-sitemap.xml
