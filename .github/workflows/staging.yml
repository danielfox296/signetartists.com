name: Deploy staging.signetartists.com

# Builds the staging branch with the new build (site/, from content/) and
# pushes the output to danielfox296/signet-staging, whose Pages site serves
# staging.signetartists.com. This workflow has no Pages permission in this
# repo, and its one key (STAGING_DEPLOY_KEY, a deploy key on signet-staging)
# opens nothing else, so it cannot reach signetartists.com.

on:
  push:
    branches: [staging]

permissions:
  contents: read

concurrency:
  group: staging
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      # Full history: a page's sitemap <lastmod> is its file's last commit.
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0

      # Setup, install, build, stage and check: the steps the live deploy shares.
      - name: Build site
        uses: ./.github/actions/build-site
        with:
          install-args: --omit=dev

      # The staging domain, plain HTML (no Jekyll), the commit it was built
      # from at /commit.txt, and a robots.txt that lets crawlers in. Every page
      # carries noindex, and a crawler can only see that tag if it may fetch
      # the page. Forms post nowhere: a send goes to the thanks page and no
      # email leaves. The run fails if any page can't take the tag or any form
      # still sends.
      - name: Make it staging
        run: |
          echo "staging.signetartists.com" > _site/CNAME
          : > _site/.nojekyll
          echo "$GITHUB_SHA" > _site/commit.txt
          printf 'User-agent: *\nAllow: /\n' > _site/robots.txt
          python3 scripts/make_staging.py _site

      - name: Push to signet-staging
        uses: ./.github/actions/publish-pages-repo
        with:
          repo: danielfox296/signet-staging
          key: ${{ secrets.STAGING_DEPLOY_KEY }}
          source: _site
          message: Build of signetartists.com
