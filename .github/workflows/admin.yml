name: Deploy admin.signetartists.com

# Builds the admin app (site/admin/) from the staging branch, so the admin
# always edits with the same components staging is built with, and pushes it
# to danielfox296/signet-admin, whose Pages site serves admin.signetartists.com.
# Its one key (ADMIN_DEPLOY_KEY, a deploy key on signet-admin) opens nothing
# else. The admin holds no secrets: each person signs in with their own token.

on:
  push:
    branches: [staging]
    paths:
      - "site/admin/**"
      - "site/src/**"
      - "site/package.json"
      - "site/package-lock.json"
      - ".github/workflows/admin.yml"
      - ".github/actions/publish-pages-repo/**"
      - ".nvmrc"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: admin
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: site/package-lock.json

      - name: Install
        run: npm ci --prefix site

      - name: Build admin
        run: npm --prefix site run build:admin

      # The admin's domain, plain HTML (no Jekyll), the commit it was built
      # from, and nothing for search engines.
      - name: Stage
        run: |
          mkdir -p _admin
          rsync -a site/admin/dist/ _admin/
          echo "admin.signetartists.com" > _admin/CNAME
          : > _admin/.nojekyll
          echo "$GITHUB_SHA" > _admin/commit.txt
          printf 'User-agent: *\nDisallow: /\n' > _admin/robots.txt

      - name: Push to signet-admin
        uses: ./.github/actions/publish-pages-repo
        with:
          repo: danielfox296/signet-admin
          key: ${{ secrets.ADMIN_DEPLOY_KEY }}
          source: _admin
          message: Admin build of signetartists.com
          keep-assets: "true"
