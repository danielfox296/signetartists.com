<!-- WCAG 2.4.1 Bypass Blocks. Visually hidden until it takes focus, so
     the first Tab on any page offers the content instead of eight nav
     links. Added 2026-09-22; the site had no skip link at all. -->
<a class="skip-link" href="#main">Skip to content</a>

<header class="site-header">
  <div class="wrap header-inner">
    <!-- The location cue, 2026-08-27 (Daniel: the site did not read as
         front-range centric). A third line under the wordmark, so every page
         says where in one glance at every width, and the nav row stays
         uncrowded. Display form, not the footer's prose form. -->
    <div class="brand-lockup">
      <a class="wordmark" href="{{home_href}}">{{brand_name}}</a>
      <p class="header-loc">BOOK LIVE MUSIC IN COLORADO</p>
    </div>

    <!-- Songs added 2026-08-07. /repertoire/ carries the cover walls and the
         whole song book and was reachable only from two inline prose links and
         one hub card. The best page on the site, absent from its own
         navigation. "Songs" rather than "Repertoire" because it sits next to
         "The Music" and the pair has to read as two different questions: who
         plays, and what they play. -->
    <!-- Weddings added 2026-09-06 with the /weddings/ hub, when Daniel lifted
         the one-wedding-surface cap. It sits between Corporate and Private
         Parties because the three are one row of occasion hubs and corporate
         keeps the earlier slot. -->
    <!-- Corporate and Private Parties are the two occasion hubs of the
         2026-08-20 buildout; corporate keeps the earlier slot. "Corporate"
         rather than "Corporate & Galas": the 17 Aug audit reframed galas as a
         small-format section on the hub, not a co-headline. -->
    <nav class="nav-desktop">
      <a href="{{nav_prefix}}music/" {{nav_music}}>Artist Roster</a>
      <a href="{{nav_prefix}}repertoire/" {{nav_repertoire}}>Songs</a>
      <a href="{{nav_prefix}}pricing/" {{nav_pricing}}>Pricing</a>
      <a href="{{nav_prefix}}corporate/" {{nav_corporate}}>Corporate</a>
      <a href="{{nav_prefix}}weddings/" {{nav_weddings}}>Weddings</a>
      <a href="{{nav_prefix}}private-parties/" {{nav_private}}>Private Parties</a>
      <a href="{{nav_prefix}}planners/" {{nav_planners}}>For Planners</a>
      <a class="btn btn--sm" href="{{nav_prefix}}contact/" {{nav_contact}}>Check a Date</a>
    </nav>

    <button type="button" class="nav-toggle" aria-expanded="false" aria-controls="mobile-nav">Menu</button>
  </div>

  <!-- The mobile menu covers every width under 1024px, which is most of the
       traffic, so it carries what the desktop row carries and is labelled the
       same way. Two things it did not have until 2026-09-22: the same label as
       the desktop row for /music/ (the roster was "The Roster" here, "Artist
       Roster" in the desktop row and "Artist roster" in the footer — one
       destination, three anchor texts, on every page), and aria-current, so
       there was no current-page indicator at all below 1024px. The nav_* tokens
       resolve in both rows; build.py replaces every occurrence.

       Daytime has no desktop slot — the row needs 987px of content width as it
       stands and swaps in at 1024 — but the menu is a stacked list with room,
       so the fourth occasion tree is reachable from the nav here. -->
  <nav class="nav-mobile" id="mobile-nav">
    <a href="{{nav_prefix}}music/" {{nav_music}}>Artist Roster</a>
    <a href="{{nav_prefix}}repertoire/" {{nav_repertoire}}>Songs</a>
    <a href="{{nav_prefix}}pricing/" {{nav_pricing}}>Pricing</a>
    <a href="{{nav_prefix}}corporate/" {{nav_corporate}}>Corporate</a>
    <a href="{{nav_prefix}}weddings/" {{nav_weddings}}>Weddings</a>
    <a href="{{nav_prefix}}private-parties/" {{nav_private}}>Private Parties</a>
    <a href="{{nav_prefix}}daytime/">Daytime</a>
    <a href="{{nav_prefix}}planners/" {{nav_planners}}>For Planners</a>
    <a class="btn nav-mobile-cta" href="{{nav_prefix}}contact/" {{nav_contact}}>Check a Date</a>
  </nav>
</header>
