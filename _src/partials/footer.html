<footer class="site-footer">
  <div class="wrap footer-inner">
    <div class="footer-brand">
      <p class="wordmark">{{brand_name}}</p>
      <p class="footer-line">{{brand_service_area}}. Travel rates are published on the pricing page.</p>
    </div>

    <div class="footer-cols">
      <div>
        <p class="eyebrow">Enquiries</p>
        <ul class="footer-list">
          <li><a href="mailto:{{brand_email_raw}}">{{brand_email}}</a></li>
        </ul>
      </div>
      <div>
        <p class="eyebrow">Site</p>
        <ul class="footer-list">
          <li><a href="{{nav_prefix}}pricing/">Pricing</a></li>
          <li><a href="{{nav_prefix}}planners/">For Planners</a></li>
          <li><a href="{{nav_prefix}}contact/">Check a Date</a></li>
        </ul>
      </div>
    </div>
  </div>

  <div class="wrap">
    <p class="footer-meta">&copy; 2026 {{brand_legal_name}}. {{brand_name}} is its trade name.</p>
  </div>
</footer>
