  - type: prose
    body: |
      For a company with no office, the offsite is the office. It's the one
      week a year, sometimes two, when people who have worked together for
      three years shake hands, and everything the company believes about its
      culture has to survive contact with a hotel ballroom and a dinner
      reservation for sixty.

      The numbers say how common that week has become. {{market:offsites_remote_hybrid_share}}
      of the people organising company offsites work in a fully remote or
      hybrid arrangement themselves, {{market:offsites_essential_remote}} of
      fully remote companies say the offsite is essential to the success of
      the business, and {{market:offsites_one_or_two_per_year}} of companies
      hold one or two a year. The average offsite runs about four and a half
      days and three and a half nights, on weekdays, with team building named
      as the primary objective by {{market:offsites_team_building_objective}}
      of companies. Behind those figures sits the workforce itself:
      {{market:gallup_hybrid_share}} of remote-capable employees in the United
      States work hybrid and {{market:gallup_remote_share}} work exclusively
      remote, so the company that has to fly everyone in to see each other isn't
      the exception anymore.

      This post is for the person planning that week in Colorado: what the
      agenda usually holds, where remote teams go here, and seven evenings that
      do the part of the job the working sessions can't.

  - type: subhead
    text: "What a company offsite agenda usually holds"

  - type: prose
    body: |
      The pattern is consistent across the reports and the planners' own threads.
      Nearly every group has meeting space at the accommodation. Meals are at
      the accommodation too, with {{market:offsites_meals_at_accommodation}}
      of groups taking three or more there. The average stay has two
      team-building activities in it. It runs on weekdays, because a remote
      company's offsite is work, and September is the single most popular
      month, holding {{market:offsites_september_share}} of the year's
      offsites, with December-to-March bookings up
      {{market:offsites_winter_rise}} year on year. Budgets have moved the
      same direction: {{market:offsite_budgets_up_since_2019}}
      of companies have increased what they spend on offsites since 2019.

      The advice that recurs when engineers and managers ask each other about
      offsites is about the evenings, and it's a warning: don't overbook
      them. A team that has spent eight hours in meetings doesn't want a
      second program at dinner. It wants a
      good meal, a drink, and something in the space that gives people who
      have only met on video a reason to stand near each other. That's the
      gap this post fills.

  - type: subhead
    text: "Where remote teams go in Colorado"

  - type: prose
    body: |
      Colorado wins the offsite for a practical reason before a scenic one: a
      hub airport a distributed team can reach from most of the country
      without a connection, and a mountain evening within two hours of it.
      What the search results for a Colorado company retreat show is venues,
      and they fall into four kinds.

      **The guest ranches.** Devil's Thumb Ranch outside Tabernash publishes
      barns and pavilions from forty to two hundred and fifty people, fly
      fishing, zip lines, ropes courses and horseback riding for the
      team-building slots, and nightly s'mores as the evening program. C Lazy
      U near Granby sells all-inclusive group rates with lodging, meals and
      ranch activities in one figure. These are the offsites where the whole
      company sleeps on the property and the evening happens in a barn.

      **The mountain-town basecamps.** Gravity Haus positions its Breckenridge,
      Vail, Winter Park, Steamboat Springs and Denver locations for, in its
      own words, "remote board meetings, company retreats, and team bonding,"
      with coworking space, restaurants and bars and gear rental in one
      building. This is the offsite for the company that wants the town.

      **The resort towns.** Vail, Beaver Creek, Aspen and Breckenridge, where
      the hotels run group business all year and the evening comes with a
      decibel cap and a curfew written into the contract. Our
      [retreats page](https://signetartists.com/corporate/retreats/) and its
      town pages cover the drive, the lodging and the sound rules for each
      town.

      **Denver itself.** For the company that flies in and stays downtown, the
      convention-center hotels and the city's own venues host the working
      days, and the Colorado evening is a drive away. A growing
      set of remote-first companies are based here already; "remote companies
      colorado" is a search Google completes on its own.

  - type: subhead
    text: "The arrival night: an acoustic set under the first dinner"

  - type: prose
    body: |
      The first evening of an offsite is the strangest hour of the year for a
      remote company. Sixty people who know each other's faces from a grid
      are in one place, and the first ten minutes decide whether the week
      feels like a reunion or a conference. An [acoustic duo](https://signetartists.com/ensembles/acoustic-duo/)
      or the [Americana trio](https://signetartists.com/ensembles/americana-band/)
      at conversation volume, 65 to 72 dBA at the nearest table, gives people
      a reason to drift toward the same corner and something to stand next to
      while they work out who's who. Nobody is asked to do anything, and the
      evening has a middle to it that no icebreaker had to supply.

  - type: subhead
    text: "The Colorado evening"

  - type: prose
    body: |
      A third of planners now report more demand for locally flavored events,
      {{market:planners_want_local}} in the most recent industry forecast, and a
      team that flew in from six cities wants one evening that could only
      have happened here. The [Americana band](https://signetartists.com/ensembles/americana-band/)
      plays the songs people expect in the mountains, the Grateful Dead, Tom
      Petty and Neil Young, beside the songs written here, Nathaniel Rateliff
      and Gregory Alan Isakov, on acoustic guitar, fiddle, upright bass and
      drums. In a ranch barn it's the dinner and the dance floor in one
      booking.

  - type: subhead
    text: "Live band karaoke, the remote team's icebreaker"

  - type: prose
    body: |
      Karaoke sits near the top of the offsite ideas lists the big employers
      publish, and for a remote team it does something a trivia night cannot:
      it puts the quiet engineer from the Lisbon time zone on a stage with the
      head of sales, singing Journey, with a real band behind them. The band
      plays the 80s and 90s hits on its own, sung out front, and hands the mic
      to anyone who wants a song, with the words on a screen and a host on the
      floor. Nobody has to sing for the night to work, and by the third song
      the list fills on its own. It's the evening people quote back to each
      other on the video calls for the rest of the year. The
      [live band karaoke page](https://signetartists.com/ensembles/live-band-karaoke/)
      has the songbook and the builds.

  - type: subhead
    text: "The last night: the whole company on one floor"

  - type: prose
    body: |
      Most offsites end on the one evening that's a party without a program.
      The act is the [yacht rock band](https://signetartists.com/ensembles/yacht-rock/)
      for a crowd that wants to sing every chorus, the
      [soul and R&B band](https://signetartists.com/ensembles/soul-band/) for a ballroom
      floor, or the [DJ](https://signetartists.com/ensembles/dj/) with a live
      musician over the set, on the sound system that has been in the building
      since the first night. A band handing off to the DJ through the same
      system covers a company that wants to keep dancing after the band's last
      set, and it's one contract for the whole stay.

  - type: subhead
    text: "The winter offsite is an apres-ski evening by default"

  - type: prose
    body: |
      December-to-March offsites are the growth segment, and a Colorado
      company that books one gets the theme for free: the snow is outside the
      window. The evening is the Americana band by the fire, a solo pianist
      through a long dinner, or the karaoke night in a ski-town bar the
      company has bought out. The [retreats page](https://signetartists.com/corporate/retreats/)
      carries the mountain rules, and the
      [Vail evening ideas](https://signetartists.com/blog/corporate-retreat-evening-ideas-vail/)
      post covers the town in detail.

  - type: subhead
    text: "The unstructured evening, with music under it"

  - type: prose
    body: |
      The evening the engineers asked for, with no session, no facilitator
      and no slide. It's a long table, or several, with a
      [jazz duo](https://signetartists.com/ensembles/jazz-duo-trio/) or a
      solo pianist at a level the table talks across. It's the cheapest idea
      on this list and the one that most often produces the conversation the
      offsite was for, because the two people who needed to talk about the
      roadmap finally do it over a drink with nobody watching.

  - type: subhead
    text: "The founder's fireside"

  - type: prose
    body: |
      Many remote companies hold one evening where the founder or the CEO
      talks without slides, and the format wants music around it the way an
      award night does: something before, silence during, something after.
      A [solo Spanish guitarist](https://signetartists.com/ensembles/spanish-guitarist/)
      or the acoustic duo plays through the gathering, an announcement
      microphone covers the remarks, and the music comes back in on the
      applause. The way the music works around remarks is set out on the
      [galas and award nights page](https://signetartists.com/corporate/galas-and-awards/),
      and it applies to a fireside exactly.

  - type: subhead
    text: "The daytime belongs to the venues and outfitters"

  - type: prose
    body: |
      The team-building slots belong to the venues and the outfitters: ropes
      courses, fly fishing, a cattle-roping clinic, a hike, a cooking class,
      the s'mores. Two of those across the stay is the average, and none of
      them is a music vendor's business. What the music does is hold the
      evenings together, and it does that best when the day was theirs and
      the night isn't another program.

      The one exception on our side is
      [Firstwater](https://signetartists.com/artists/firstwater/), a
      seventy-five-minute sound bath with the whole team lying on the floor
      and nothing to do.
      It goes into the agenda to open a morning or close an evening, and
      nobody has to do anything for it beyond lying down.

      Ask whoever is planning your week what the evenings hold, and if the
      answer is "dinner," that's the gap.

