sections:
  - type: key_takeaways
    items:
      - "A jazz trio is three musicians: a rhythm section of bass and drums with one instrument that carries the melody and the chords, most often piano or guitar."
      - "The trio that works at a private event is guitar, upright bass and drums played with brushes, because brushes let a drum kit sit under a conversation instead of over it."
      - "A quartet is the same three with a horn or a voice added. That's the size for a floor, and the size a wedding or a gala usually books after dinner."
      - "Duo, trio or quartet is a question about the size of the crowd and whether anyone is going to dance, and the answer is usually smaller than people expect."

  - type: prose
    body: |
      A jazz trio is three musicians playing jazz, and that's the whole
      definition. What people are actually asking when they type the
      question is which three instruments, because a trio is a format rather
      than a fixed lineup, and the format changes what it sounds like and
      where it fits.

  - type: subhead
    text: "What instruments are in a jazz trio?"

  - type: prose
    body: |
      Almost every trio is a rhythm section of bass and drums with one
      instrument on top that plays the melody and the chords at once. The
      classic combinations:

      - **Piano, bass and drums.** The trio of the jazz records most people
        know, from Bill Evans to the Vince Guaraldi Christmas album. Piano
        carries the melody and the harmony, upright bass walks underneath,
        drums keep time.
      - **Guitar, bass and drums.** The same job with a guitar instead of a
        piano. It's the trio that travels, because a guitar amplifier fits
        in a car and a grand piano doesn't, and it's the trio on this
        roster.
      - **The organ trio.** Hammond organ, guitar and drums, with the
        organist playing the bass line on the pedals. Soul-jazz, greasy and
        loud, and a club sound rather than a dinner sound.
      - **A trio with no drums.** Piano or guitar, bass, and a horn or a
        second melody instrument. Quieter and more open, and the one to
        book when a venue can't take a drum kit at all.

      When people search for "jazz bands usually include," the answer is the
      rhythm section plus however many melody instruments the size allows.
      A duo is one of those trios with the drums left out. A quartet adds one
      more melody instrument.

  - type: video

  - type: subhead
    text: "Which jazz trio works at a private event?"

  - type: prose
    body: |
      The trio that works is guitar, upright bass and drums played with
      brushes. The brushes are the part that matters. A drum kit played with sticks is a dance-floor
      instrument; the same kit played with brushes sits under a conversation, at a level two guests who've just met can talk across without leaning in.

      It's upright bass rather than electric for the same reason. It carries a
      dinner without a subwoofer, and from across the venue it sounds the way
      people expect a jazz trio to sound.

      What it plays is the standards: the songbook from the thirties to the
      sixties that nobody has to be told about. Autumn Leaves, All of Me,
      The Girl from Ipanema, the ballads and the bossa novas. At a private event
      the point of the standards is that guests recognize them without naming them, and the evening feels thought through.

  - type: subhead
    text: "What does a quartet add, and when do you need it?"

  - type: prose
    body: |
      A quartet is the trio plus one: a saxophone or a trumpet, or a singer.
      That fourth musician changes the job. A horn puts a lead voice on the
      melody, which is what a featured set at a gala wants. A vocalist turns
      the book into songs people sing along to under their breath, which is
      what a floor wants after dinner.

      The question "jazz trio or quartet" usually answers itself once you
      know whether anyone is going to dance. If nobody's dancing, the trio
      covers the whole evening. If there's a first dance and an open floor
      after dinner, the trio plays through dinner and the quartet takes over
      after it, on the same contract. A ballroom of two hundred wants the
      quartet with a singer out front.

  - type: subhead
    text: "How much space and power does a jazz trio need?"

  - type: prose
    body: |
      A trio needs twelve by eight feet, one dedicated 20-amp circuit, and
      about an hour to load in. That's a corner of a private dining venue or a ballroom,
      and it's the reason a trio fits venues a band can't. A duo needs eight
      by six on the same circuit. The full footprints and power lists by
      size are on the [technical page](https://signetartists.com/planners/technical/),
      in a form a venue can check line by line.

  - type: subhead
    text: "Duo, trio or quartet: which one to book"

  - type: prose
    body: |
      - **A duo** for a cocktail hour, a client dinner for twenty to sixty, a
        dinner party at home. Upright bass and guitar, no drums, and two
        musicians can't get loud by accident.
      - **A trio** for a dinner past sixty, a longer evening, or a floor that
        wants a pulse without a full band. The size most often booked for a
        corporate dinner and a wedding reception's dinner hour.
      - **A quartet** for the hour after dinner when the floor opens, a
        featured set at a gala, or a ballroom crowd that needs a voice out
        front.

      On this roster the duo and the trio, upright bass and guitar plus drums when the night wants them, are on the
      [jazz duo and trio page](https://signetartists.com/ensembles/jazz-duo-trio/).
      [Changes Jazz Trio](https://signetartists.com/ensembles/changes-jazz-trio/)
      is the named trio, guitar, fretless bass and drums, with its three
      musicians named on its page and a saxophone as the quartet. How a
      wedding day is sized moment by moment is on the
      [jazz band for a wedding page](https://signetartists.com/weddings/jazz-band/),
      a corporate evening slot by slot on the
      [corporate jazz band page](https://signetartists.com/corporate/jazz-band/),
      and what each size costs across this market, sourced, in
      [what a jazz band costs in Denver](https://signetartists.com/blog/what-a-jazz-band-costs-denver/).

