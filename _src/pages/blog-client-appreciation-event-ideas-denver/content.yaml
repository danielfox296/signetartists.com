sections:
  - type: key_takeaways
    items:
      - "A client appreciation evening is judged by how much talking it allowed. Every idea below is ranked by that."
      - "The verticals want different evenings: advisors host a short program and a long social half, realtors host families in daylight, firms host small tables."
      - "Live music is the idea that makes an evening feel hosted while leaving space for people to talk, which is why it sits under most of the others rather than beside them."
      - "A jazz trio or acoustic duo for a dinner runs {{market:us_dinner_band}} across this market, and that is the figure to walk into a budget conversation with."

  - type: prose
    body: |
      The best version of this night looks like nothing much. Fifty people
      your firm depends on, a drink in their hand, somebody they have only
      emailed for two years standing in front of them, and a reason to stay
      another twenty minutes. Nobody is presented to. Nobody is prospected.
      They leave saying it was a good evening, and they say your name when
      they say it.

      That is harder to plan than a sales dinner, because there is no agenda
      to hide behind. What follows is eight shapes this evening takes in
      Denver, ordered by how much conversation each one actually allows, with
      the vertical notes underneath for the three groups who host these most
      often. Money first, so the rest reads honestly: a jazz trio or acoustic
      duo for a dinner runs {{market:us_dinner_band}} in this market, and a
      cover or jazz band for a corporate event runs
      {{market:us_corporate_band}}. Where that lands for your evening is on
      the [pricing page](https://signetartists.com/pricing/).

  - type: subhead
    text: "The dinner with music under it"

  - type: prose
    body: |
      The default, and the one that survives contact with a real client list.
      A private dining floor, one long table or three round ones, and a duo
      in the corner playing standards under the conversation. The music does
      two jobs at once. It fills the silence people feel when they arrive
      before they know anyone, and it gives the evening a shape that does not
      depend on a speech.

      The volume is the whole trick. Dinner music sits at 65 to 72 dBA at the
      nearest table, which is a level guests talk across without leaning in.
      Above that, your clients spend the night half shouting and remember
      that instead. The full version of this evening, including the
      procurement path a firm's finance team will ask about, is on our
      [client dinners page](https://signetartists.com/corporate/client-dinners/).

  - type: subhead
    text: "The chef's counter"

  - type: prose
    body: |
      Eight to twelve people at a counter watching the food get made. It is
      the highest-conversation format on this list because there is a shared
      thing to look at whenever the talking pauses, and it scales down to the
      client list you genuinely cannot afford to lose. Denver has the
      restaurants for it, and most of them will do a set menu and a private
      counter on a weeknight.

      What it does not scale to is fifty guests. Past about a dozen this
      becomes a dinner in a private dining space, which is the idea above.

  - type: subhead
    text: "The tasting"

  - type: prose
    body: |
      Whiskey, wine, or a distillery tour with a guide who is genuinely good
      at talking. A tasting gives guests a script for the first ten minutes,
      which is the part of the evening people dread, and it hands them
      something to have an opinion about. Denver's distilleries and the
      RiNo tasting spaces both host these as a matter of course.

      A tasting and live music sit together comfortably, as long as the
      music stays under the guide. A solo player through the tasting and a
      duo after it is the usual build.

  - type: subhead
    text: "The museum or gallery evening"

  - type: prose
    body: |
      A private evening in a gallery works on people who have been to four
      client dinners this quarter already. The art carries the first half of
      the conversation, and the venue does the flattering on your behalf, so
      the host does not have to.

      These venues run their own event calendars and their own vendor rules,
      and both fill early for the fall. Ask what the venue's sound policy is
      before you plan the music, because a gallery floor is a hard surface
      and the number it gives you decides the size of the act.

  - type: subhead
    text: "The suite at the ballpark"

  - type: prose
    body: |
      The most forgiving format on the list. A game gives guests permission
      to come and go, to talk in fragments, and to leave early without it
      being a statement. It is also the one that works when your client list
      spans a wide range of ages and interests, because nobody has to enjoy
      the same thing.

      It is a poor fit for a firm whose message is precision and calm. Read
      your own list before you book it.

  - type: subhead
    text: "The seminar with a real evening after it"

  - type: prose
    body: |
      Forty-five minutes of something genuinely worth knowing, then food,
      drinks and music for twice that long. The program earns the invitation
      and the second half is what people remember. The failure mode is
      obvious and common: the program runs long, the social half gets cut,
      and guests leave having been talked at.

      Give the evening a hard end to the talking part and let the music start
      as the deck comes off the screen. A duo playing while people stand up
      and refill their glasses is the sound of a program ending, and it moves
      the audience without anyone announcing anything.

  - type: subhead
    text: "The family afternoon"

  - type: prose
    body: |
      Daylight, outdoors, children welcome. Pumpkins in October, ice cream in
      July, a park or a brewery patio with a lawn on it. This is a different
      kind of thank-you: it says you know who your clients actually are, and
      it reaches the person who never comes to the evening events because
      they are at home with a six-year-old.

      Music outdoors is a solo or a duo at conversation volume with power run
      to a covered spot. Colorado afternoons turn fast, and instruments and
      electronics both stop behaving in the wet, so the move-indoors call gets
      agreed before the day rather than during it.

  - type: subhead
    text: "The open house at your own office"

  - type: prose
    body: |
      The cheapest idea here and the most underrated, because your office is
      the one venue that says something true about your firm. Clear the main
      floor, bring in a caterer, and put a solo guitarist in the corner where
      the reception desk usually is. An hour of music is a real booking rather
      than a minimum to work around, and a solo player sets up in 6 by 4 feet
      on one dedicated circuit, which fits an office floor without moving the
      desks.

      It also solves the parking question, because your clients already know
      where to park.

