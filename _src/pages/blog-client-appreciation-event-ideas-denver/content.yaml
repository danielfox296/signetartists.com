  - type: subhead
    text: "Client appreciation event ideas for financial advisors"

  - type: prose
    body: |
      The advisor's version has two halves and the second one matters more.
      The invitation usually needs a reason to exist, so there is a market
      update, a guest economist or a tax-year briefing at the front, and then
      the evening opens out. Spouses come. The average age in the audience is
      older than the firm expects, and the venue's acoustics matter more
      because of it.

      That is the practical argument for live players over a playlist at
      these evenings. A duo playing standards holds a level people can hear
      each other over, and it stays there all night, where a sound system
      with a phone plugged into it drifts louder as the evening gets busier.
      Book the music for the social half and let it start under the last five
      minutes of the program.

  - type: subhead
    text: "Client appreciation event ideas for realtors"

  - type: prose
    body: |
      The realtor's list is different in kind: past clients, referral
      partners, lenders and title people, spread across a metro area and
      across a decade. The events that work are the daylight ones with
      families in them, and the ones tied to a season people already
      celebrate. A pie giveaway before Thanksgiving, a movie on a lawn, a
      pumpkin patch afternoon, a summer party at a brewery with a patio.

      Music here is background and daylight-friendly: one player or two,
      acoustic, covers people can sing along to without being asked to. The
      shapes and the practical requirements are on our
      [private parties page](https://signetartists.com/private-parties/),
      because a realtor client event is closer to a private party than to a
      corporate program.

  - type: subhead
    text: "Client appreciation event ideas for law firms"

  - type: prose
    body: |
      Firms host small and they host formal. A dinner for twelve referral
      partners in a private dining space does more for a practice than a
      reception for two hundred, and partners generally know it. The venues
      are the member institutions and the hotel private floors: the
      University Club of Denver and the Denver Athletic Club class of club,
      the Brown Palace and the Oxford class of hotel.

      Two things reliably slow a firm's booking down, and neither is the
      choice of act. One is vendor onboarding, which takes as long as your
      finance process takes, so start it when you shortlist rather than after
      the date is chosen. The other is the certificate of insurance a club
      asks for before it will confirm the date. Both are covered on the
      [client dinners page](https://signetartists.com/corporate/client-dinners/),
      with the net-30 path a firm's accounts team will want to read.

  - type: subhead
    text: "Where the music actually sits"

  - type: prose
    body: |
      Ask a group of planners what to do at a client evening that is not the
      usual, and the answers come back magicians, mentalists, tarot readers
      and casino tables. The reason is worth reading closely. Those formats
      get recommended because they give guests a reason to stop, gather and
      then talk to each other, without commanding the whole evening or
      putting anyone on the spot.

      Live music does that job from the corner, and it does it for the whole
      night rather than for the fifteen minutes the magician is at your
      table. A duo playing at conversation volume makes an evening feel
      hosted. Guests notice it on the way out rather than during, which is
      exactly what you want from a night whose purpose is to make people feel
      thanked rather than entertained at.

      Our artists have played for Amazon, NBCUniversal, Charles Schwab,
      Kroger, the Denver Art Museum, Sheraton, Hyatt, the Washington
      Nationals, Casa Bonita and Monarch Casino Resort Spa Black Hawk. The
      formats that fit a client evening are the small ones: the
      [jazz duo](https://signetartists.com/ensembles/jazz-duo-trio/) for
      standards under a dinner, the
      [acoustic duo](https://signetartists.com/ensembles/acoustic-duo/) for
      covers guests can name, and the
      [solo guitarist](https://signetartists.com/ensembles/solo-guitarist/)
      for an office floor or a tasting.

