meta_description: "How loud background music should be at a party or company event: about as loud as the conversation around it, which is 60 to 65 dBA at the nearest table, and how live musicians keep it there."
llms_description: "How loud background music should be at a party, dinner or company holiday party, from an agency that books live musicians in Colorado. The answer is about as loud as the conversation around it, 60 to 65 dBA at the table nearest the musicians, against 88 to 95 dBA on a dance floor and silence for speeches. Covers how musicians set the level by ear as a party fills and empties, sizing the act to the headcount, instrumental against vocals under conversation, playing with no amplification in a small space and with sound support in a ballroom or outdoors, and what to do with a venue's volume limit or Colorado's residential noise cap."

