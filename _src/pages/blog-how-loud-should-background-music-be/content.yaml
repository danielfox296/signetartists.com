sections:
  - type: key_takeaways
    items:
      - "Background music at a party sits under the talk, so everyone talks in their normal voice. For a planner, that's 60 to 65 dBA at the table nearest the musicians."
      - "A live act follows the crowd's own volume through the evening, one song at a time."
      - "Instrumental music is the easier kind to talk over, and a singer with a guitar plays at the same conversation level."

  - type: prose
    body: |
      Think of the best dinner party you've been to. You and the person across
      the table talked all evening without leaning in, and every so often one
      of you stopped mid-sentence because a song you both knew had come on.
      That's the level background music should sit at, and it's where our
      musicians keep cocktails and dinner.

  - type: subhead
    text: "How many decibels should background music be?"

  - type: prose
    body: |
      About as loud as the conversation around it. Two people standing next
      to each other talk in their normal voices, and a guest at the far end of
      the party can still pick out the tune. If the venue or the run of show
      needs a figure, write down 60 to 65 dBA, measured at the table closest
      to the musicians.

      An evening with a program or a dance floor in it has more than one
      level, and a planner can put all of them in writing:

  - type: comparison_table
    title: "The levels of an evening"
    columns: ["", "What guests hear", "Measured"]
    rows:
      - ["Cocktails and dinner", "Music under the talk; the nearest table talks in normal voices", "60 to 65 dBA at the nearest table"]
      - ["Speeches, awards, anyone else on a microphone", "The music stops", "Silent"]
      - ["Dancing", "Loud enough to dance to, too loud to hold a conversation on the floor", "88 to 95 dBA on the floor"]
      - ["The last hour of dancing", "The loudest point of the night", "Peaks of 100 dBA"]

  - type: subhead
    text: "What the research says about music and conversation"

  - type: prose
    body: |
      Acoustics research on restaurants and banquets has measured where
      conversation stops working. Two people an arm's length apart can hold a
      comfortable conversation while the total sound around them is at about
      71 decibels or less. For a round table of ten to talk across, it needs
      to be about 59. At 77 decibels, a guest can only talk to the person
      right beside them.

      One large banquet, measured in three halls, ran at 83 to 87 decibels.
      The same research recommends background music at no more than 60 to 65
      decibels, which is where our dinner level sits.

      A party also gets louder by itself. Once the background noise passes
      about 45 decibels, people raise their voices by about half a decibel
      for every decibel of noise. Since everyone does it at once, the whole
      party just gets louder, and it doesn't get any easier to hear each
      other. Music adds to that total, so it helps to have musicians who can
      adjust the level as the crowd gets louder or quieter.

      It's different again for older guests. In the United States, 22% of
      people aged 65 to 74 and 55% of those 75 and older have disabling
      hearing loss. In a 2022 lab study of 31 adults over 60, understanding
      speech began to slip when the background reached about 51 decibels. So
      at a party with grandparents, it's kinder to keep the music quieter and
      to seat them away from the speakers.

  - type: video

  - type: subhead
    text: "Can guests talk over live music?"

  - type: prose
    body: |
      Yes. Musicians hear the party they're playing for. A crowd gets louder
      as more people arrive and softer when half of them step out onto a
      terrace, and a duo follows that change with the next song, so the music
      stays under the talk from the first guest to the last.

      The other half of it is matching the size of the act to the headcount.
      A duo of guitar and upright bass is the size for a dinner of twenty to
      sixty. Past sixty guests, a trio adds a drummer playing with brushes, which
      gives a bigger crowd a steady pulse at the same dinner level.

  - type: subhead
    text: "Instrumental or vocals when people are talking?"

  - type: prose
    body: |
      Instrumental is the easier one to talk over, because the only words in
      the air are the guests' own. Instrumental acts on the roster include the
      [jazz duo](https://signetartists.com/ensembles/jazz-duo-trio/), the
      [Spanish guitarist](https://signetartists.com/ensembles/spanish-guitarist/)
      and [classical strings](https://signetartists.com/ensembles/string-quartet/),
      each of them at home under an evening that's mostly conversation.

      Lab studies agree that sung words compete with speech more than
      instrumental music does. In one, 30 students read a passage in quiet,
      with instrumental music, or with songs that had lyrics. They understood
      it about as well with instrumental music as in quiet, and worst with
      lyrics, whether or not they liked the songs. These are lab studies of
      reading and memory, though, and as far as we know nobody has tested it
      at a dinner.

      A singer works too. A
      [singer and guitarist](https://signetartists.com/ensembles/singer-guitarist/)
      sets the voice at conversation level, so the words are there for anyone
      who wants to follow them and the next table talks at its own volume.

  - type: subhead
    text: "How the space changes the level"

  - type: prose
    body: |
      In a small space, a guitarist, a duo or a string quartet plays with
      nothing plugged in at all, and a pianist plays the stage piano barely
      amplified. A ballroom is the opposite case. The musicians bring sound
      support so the back tables hear the tune, and the tables nearest the
      musicians get no louder for it.

      Outdoors, a guitar is close and warm for about thirty feet and fades
      after that, because there are no walls to send the sound back toward
      the guests. An outdoor party gets a small sound system for that reason,
      turned up only as far as it takes to reach the edge of the lawn at
      conversation level.

  - type: subhead
    text: "What if the venue has a volume limit?"

  - type: prose
    body: |
      Give us the venue's limit when you book. With the figure in hand before
      the night, the musicians choose the instrumentation and the arrangements
      that fit under it, and the evening still sounds the way it was planned.

      In a residential zone,
      [Colorado caps noise](https://signetartists.com/blog/outdoor-reception/)
      at 50 dB(A) after 7pm, measured 25 feet or more beyond the property
      line.

  - type: subhead
    text: "Music for a company holiday party people can talk over"

  - type: prose
    body: |
      A company holiday party puts people from different departments at the
      same tables, so most of the evening is conversation. The
      [Christmas jazz trio](https://signetartists.com/ensembles/christmas-jazz-trio/)
      plays that kind of party: the Vince Guaraldi record and the season's
      standards on guitar, upright bass and brushed drums, at conversation
      level. A company that wants a dance floor as well books a band, and a
      band plays dinner at the same level the trio does.

      Our artists have played for Amazon, NBCUniversal, Charles Schwab,
      Kroger, the Denver Art Museum, Sheraton, Hyatt, the Washington
      Nationals, Casa Bonita and Monarch Casino.

