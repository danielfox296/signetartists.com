<!-- The artwork. Daniel asked for Beatles cover art on this page (2026-09-22)
     and then set the terms himself: published album covers are copyrighted
     artwork. So none was used. What is here was drawn from scratch for this
     act in scripts/bird_art.py, in the visual language of mid-sixties sleeve
     design, and it reproduces nothing: no cover, no photograph, no likeness.
     Provenance rows are in media-sources.json under photos, with the script
     as the source, and the whole set rebuilds with one command.

     Held back: nothing, because there was nothing to hold back. The act
     arrived with no site, no channel, no photographs and no footage. Both
     gaps are live asks, and the day a photograph of the duo playing or a clip
     of a crowd singing arrives, it goes through scripts/act_media.py and takes
     the hero slot, with this section staying where it is. -->
<section class="section section--ruled section--sunk">
  <div class="wrap">
    <div class="heading">
      <p class="eyebrow">The artwork</p>
      <h2 class="h2">Drawn for this act, in the colors of the records.</h2>
      <p class="lede">The sleeve was made for Your Bird Can Sing rather than borrowed from a record shelf, and so was the booklet picture further up this page.</p>
    </div>
    <!-- media-grid--single, not the 4:3 grid: the grid crops to 4 by 3 and a
         square sleeve loses its title to the crop, which defeats the point of
         showing it. The booklet artwork sits in the booking section instead,
         beside the paragraph it illustrates. -->
    <div class="media-grid media-grid--single">
      <figure><img src="{{nav_prefix}}img/acts/your-bird-can-sing-sleeve.jpg" alt="A square sleeve with the act's name set under a sunburst and a scattered flock of birds." loading="lazy" decoding="async"></figure>
    </div>
  </div>
</section>
