<!-- The list of every page under this hub, 2026-10-03. Generated by build.py
     (HUB_INDEX): the pages grouped, then the hub's articles. It sits directly
     under the opening because a visitor who clicks this hub in a breadcrumb
     is looking for the other pages in it. To move it, rename this file; the
     sections build in filename order. -->
<section class="section section--ruled hub-index-band">
  <div class="wrap">
    {{hub_index}}
  </div>
</section>
