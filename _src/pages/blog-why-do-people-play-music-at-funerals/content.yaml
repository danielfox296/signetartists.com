# ---------------------------------------------------------------------------
# Research series, second batch, 2026-10-04. Evidence for the title: Google
# suggests "why do people play music at funerals", "why do they play music
# at funerals", "how to choose funeral songs", "how to choose funeral
# music", "music played at funerals" and "songs for celebration of life"
# (read 2026-10-04). The subheads carry the question forms.
# THE ONE READER: someone arranging a service for a person they love, often
# in a hard week, who has been asked what music they want and doesn't know
# where to start.
# The most careful post in the series: plain, calm, no persuasion, no
# sentence telling the reader how they feel, and one quiet mention of what
# we do at the very end. Every study and song title comes from the writer's
# fact sheet (V1 entries in research/music-behavior-2026-10/); the only songs
# named are from the 2025 most-requested list as STV News reported it, and
# no lyric is quoted. The research is interviews with families and studies
# of what gets played, and the post says once that we found no trial.
# ---------------------------------------------------------------------------
title: "Why do people play music at funerals?"
seo_title: "Why do people play music at funerals, and how to choose it"
