meta_description: "Why music is part of a funeral, how families choose the song, what people often pick, and whether it has to be a hymn, from studies of funerals and families."
llms_description: "A summary, from a Denver company that books musicians for funerals and memorial services, of what research says about music at funerals. A study of funerals in Scotland found music used in five ways: to give the service a shape, to bring people in or leave them out, to give everyone something to do together, to stir or shift feeling, and to bring the person who died to mind, and noted that the music has moved from mostly sacred to often secular as funerals have become more personal. A 2020 Dutch study of personalized funerals found families choose a song for its connection to the person, and that what it meant in their life matters more than its words; the researcher called it a musical eulogy. In a 2022 Swedish study of 12 people who had arranged a farewell, choosing the music together gave mourners something active to do, and those who chose it in advance with the relative who was dying described that as a comfort. In a 2013 Australian study of eight bereaved caregivers, music helped them feel still connected to the person, and some stayed away from particular songs for a while. A 2024 Dutch study found funeral songs less upbeat, lower in energy and more often acoustic than other songs, and a large British funeral company's 2025 most-requested list, reported by STV News, included Time to Say Goodbye, My Way, Somewhere Over the Rainbow, You'll Never Walk Alone and Abide With Me, the only hymn in its top ten. The research is interviews and studies of what gets played; no trial of music at a funeral was found. There is no right answer, the song that was theirs is usually the one, and it can be a hymn or not."

