# ---------------------------------------------------------------------------
# Research post, drafted 2026-10-03 (the music-and-behavior series).
# Evidence for the title: Google suggests "how to get people to dance at a
# wedding", "how to get people to dance at a party", "how to get people to
# dance at a house party", "how to get people on the dance floor at a
# wedding", "what bpm makes people dance", "best bpm for dancing" and "what
# makes people dance" (all read 2026-10-03). The subheads carry the
# question forms.
# THE ONE READER: a couple or a host who wants the dance floor to happen and
# is a little afraid it won't.
# Every study and number comes from the writer's fact sheet (V1 entries in
# research/music-behavior-2026-10/), each one reported with its catch. The
# dance-floor placement section is experience, and the page says so.
# ---------------------------------------------------------------------------
title: "How to get people to dance at a wedding"
seo_title: "How to get people to dance at a wedding, according to the research"
slug: "how-to-get-people-to-dance-at-a-wedding"
eyebrow: "RESEARCH"
parent: "weddings/"
dek: "What studies of real dance floors and concerts have found about getting people dancing, and how far each finding goes."
date: "2026-10-03"
author:
  name: "Signet Artists"
meta_description: "How to get people to dance at a wedding, from research on real dance floors: songs people know, the tempo they move to, bass and live bands."
llms_description: "A research summary from a Denver live-music booking company on what gets people dancing at a wedding or a party. It covers a 2016 study of 46 dancers at a London club, where the crowd moved most in time with each other on better-known songs and at beats near walking pace (100 to 150 beats per minute); a 2018 lab listening study that put the drum patterns people most wanted to move to at around 100 to 120 beats per minute; a 2005 study that found people move at a steady 2 steps a second; a 2022 concert at McMaster University where bass too low to hear made the audience move about 12% more; a 2019 study where heads moved faster at a live show than at a playback of the same album; a 2012 count of singing along across 30 nights in the north of England; and 2011 brain-imaging research on dopamine and anticipation. Each finding is given with its limits. It ends with what the company has seen work for placing the dance floor, which is experience rather than research, and what its bands and DJs do."

hero:
  src: "img/unsplash/photo-1714972383570-44ddc9738355.jpg"
  alt: "A snare drum with sticks laid across it and a close microphone."

sections:
  - type: key_takeaways
    items:
      - "In a 2016 study at a London club, the crowd moved most in time with each other on the better-known songs."
      - "In a lab study, people most wanted to move to drum patterns at around 100 to 120 beats per minute, which is close to the pace people walk."
      - "At a concert at McMaster University, people moved about 12% more when speakers played bass too low to hear."
      - "Several of these studies looked at a single night or a single show, so treat them as a good starting point."

  - type: prose
    body: |
      Most weddings have that minute when the dance floor opens and everyone
      looks around to see who's going first. Sometimes it takes a song or
      two. Once a few people are out there, the rest usually follow.

      Researchers have studied what gets people moving, on real dance floors
      and at real concerts, though most of the studies are small. What they
      found can help at a birthday party or a house party, too.

  - type: subhead
    text: "Do people dance more to songs they know?"

  - type: prose
    body: |
      It looks that way. In 2016, researchers put motion sensors on 46
      dancers at a London club for a 31-minute DJ set.
      The crowd moved most in time with each other on the songs that were
      better known, which the researchers measured by how often each song
      had been played online. The catch is that it was one night and about
      ten songs.

      There may be a reason for this in the brain. A 2011 imaging study found
      that dopamine, the brain's reward chemical, is released while a
      listener is looking forward to a favorite moment in a song, before that
      moment arrives. And it's hard to look forward to a moment in a song
      you've never heard. That research was done with a small group of people
      listening to their own favorite music in a scanner. There's
      [a longer read on why you love a song more the second time](https://danielchristopherfox.com/notes/why-you-love-a-song-more-the-second-time.html)
      if you'd like to dig into it.

  - type: subhead
    text: "What gets people singing along?"

  - type: prose
    body: |
      For a 2012 study, researchers watched 1,054 songs being played across
      30 nights in five venues in the north of England, some with DJs and
      some with live bands, and counted how many people sang along. People
      sang more later in the night, on weekends, and to songs that had spent
      longer in the charts. Songs sung in a full chest voice with clear words
      got more people singing, too. A single observer did all the counting,
      though.

  - type: subhead
    text: "What bpm makes people dance?"

  - type: prose
    body: |
      The London club study found the crowd was most in sync at beats near
      walking pace, 100 to 150 beats per minute. A 2018 listening study found
      a narrower range. People rated drum patterns at around 100 to 120 beats
      per minute as the ones that most made them want to move. That one was
      done in a lab, where people listened to the patterns and rated them, so
      nobody was dancing.

      Walking pace has been measured, too. A 2005 study recorded 20 people
      through their ordinary day and found that people move at a steady 2
      steps a second, which is 120 a minute, whatever their age, height or
      weight. So 120 beats a minute falls inside both of those ranges.

  - type: subhead
    text: "Does bass make people dance more?"

  - type: prose
    body: |
      In 2022, researchers at McMaster University ran an experiment at a real
      electronic-music concert. They set up speakers that play bass too low
      to hear and switched them on and off every two minutes, while the
      audience wore motion-capture headbands. People moved about 12% more (11.8%) while the
      low bass was playing, even though they couldn't tell when it was on.
      That was one concert and one style of music.

  - type: subhead
    text: "Does a live band get more people dancing?"

  - type: prose
    body: |
      We found one study, from 2019, that comes close to answering this. In
      it, one audience watched a rock musician play an album live, and another audience heard the same
      album played back in the same hall through the same sound system.
      Motion capture showed that people's heads moved faster at the live
      show. That's a measure of how fast heads moved, which isn't the same as
      counting dancers, and there was only one show of each kind.

  - type: subhead
    text: "Where should the dance floor go?"

  - type: prose
    body: |
      We don't have a study for this one, so this is from our own
      experience. The dance floor seems to work best close enough to the band
      or DJ that people can feel the music, and far enough away that the
      volume doesn't push them back. It helps when guests at their tables can
      see the floor, because people are more likely to join in when they can
      see someone already dancing. And dancing tends to get going more easily once the crowd
      has had a chance to warm up. For more on this, there's
      [a longer essay on music in a public square](https://danielchristopherfox.com/essays/music-in-the-public-square.html),
      about a summer concert series in a park.

  - type: subhead
    text: "How our bands and DJs get people dancing"

  - type: prose
    body: |
      Our musicians usually pick songs most of the crowd knows, keep the
      tempo in the range people like to move to, and watch the dance floor to
      decide what to play next. You can get a feel for the kind of songs they
      play from our [song list](https://signetartists.com/repertoire/).

      We book bands, [DJs](https://signetartists.com/ensembles/dj/) and both
      together, so just let us know what kind of night you want. If you're still weighing
      the two, here are our thoughts on
      [choosing a band or a DJ](https://signetartists.com/blog/band-or-dj-denver/).

