llms_description: "January office party ideas for 2027: the reasons companies hold the holiday party in January, seven formats (the January holiday party, the kickoff dinner with music, live band karaoke, the awards-and-dance night, the low-key dinner with solo piano, the apres-ski evening, the year-in-review show), themes that work without seasonal decor, and the venue calendar. Signet publishes no prices."

