sections:
  - type: key_takeaways
    items:
      - "A growing share of companies hold the holiday party in January, and the venues have followed: several Denver-area holiday offers now run into the third week of January and past it."
      - "In January the party is the only invitation your people have that week. In December it competes with everyone else's."
      - "Nothing about the music changes. Standards, covers and a dance set were never seasonal, so a January party books the same acts as a December one."
      - "The formats that want the crowd's attention, live band karaoke above all, get more of it in January than they ever get in December."

  - type: prose
    body: |
      The planners who moved the party say the same two things about why.
      December belongs to everybody else, so the office party competes with
      three other invitations, a school concert and a flight home. And the
      people who plan it spend December planning it instead of attending
      anything. Move the date past the new year and the evening becomes the
      only thing on the calendar that week, the venue has dates, and the planner gets to enjoy the night they organized.

      Denver's venues have priced it in. Several now write their holiday
      packages to run from the middle of November into the third week of
      January and past it, with the same seasonal framing they use for
      December. The January party is the second half of the season now.

  - type: subhead
    text: "The January holiday party"

  - type: prose
    body: |
      This is the party you'd have held in December, held in the second or
      third week of January instead. Same venue class, same bar, same speeches,
      with one difference guests notice immediately: everybody came. You
      book the music the way you would for a December night, with a duo
      through drinks and dinner and the [DJ](https://signetartists.com/ensembles/dj/)
      or a band taking the back half on the same contract. The
      [holiday party page](https://signetartists.com/corporate/holiday-party/)
      covers the whole season, January included.

  - type: subhead
    text: "The kickoff dinner with music under it"

  - type: prose
    body: |
      January is when the sales team is in one place for the kickoff, and the
      evening after a day of sessions is a party by another name. A dinner
      with a [jazz trio](https://signetartists.com/ensembles/jazz-duo-trio/)
      at conversation volume gives a group that spent eight hours in a ballroom a reason to talk to each
      other. If the night is going to turn into dancing after the awards, the
      same booking can carry an act for the floor.

  - type: subhead
    text: "The live band karaoke night"

  - type: prose
    body: |
      This is the January idea, because it's the format that wants the crowd's
      attention and gets all of it when the evening isn't competing with the
      season. A real band plays the 80s and 90s hits on its own and hands the
      mic to anyone who wants a song, with the words on a screen and a host on
      the floor, and by the third song the list fills on its own. The
      [live band karaoke page](https://signetartists.com/ensembles/live-band-karaoke/)
      has the songbook and the builds.

  - type: subhead
    text: "The awards-and-dance night"

  - type: prose
    body: |
      This night is the year in review, the awards for it, and a dance floor
      afterward. The band plays dinner at talking level, goes silent for
      each walk-up and the
      remarks, and opens the dance floor on the emcee's last word. A
      [soul and R&B band](https://signetartists.com/ensembles/soul-band/) or the
      [yacht rock band](https://signetartists.com/ensembles/yacht-rock/) takes
      the second half, and the cues in the program are handled the way the
      [galas and award nights page](https://signetartists.com/corporate/galas-and-awards/)
      sets out.

  - type: subhead
    text: "The low-key dinner with solo piano"

  - type: prose
    body: |
      This one is for the company that wants January to feel like a reset.
      It's a long table or a private dining floor, with one musician at the
      piano through arrival and dinner, playing standards and covers the
      table talks across. It's the smallest booking on the roster and the one
      that makes a dinner feel hosted without a program.

  - type: subhead
    text: "The apres-ski evening"

  - type: prose
    body: |
      A January date at a Vail, Beaver Creek or Breckenridge venue is an
      apres-ski party by default: the snow is the theme. The
      [Americana band](https://signetartists.com/ensembles/americana-band/)
      plays the Colorado songbook by the fire, and the
      [retreats page](https://signetartists.com/corporate/retreats/) carries
      the drive and the lodging lines that a mountain date adds to the
      contract.

  - type: subhead
    text: "January work party themes that don't need a tree"

  - type: prose
    body: |
      Winter white, which the venue is already dressed for. Apres-ski,
      in the city or in the mountains. The year in review, with the awards
      built into it. The second act of New Year's, for the office that
      couldn't get everyone together on the thirty-first. And the plainest one,
      which is no theme: a good dinner, a good band and a crowd that showed
      up because nothing else was on.

