# Calibration post, 2026-09-16. Evidence: "how much does a jazz band cost",
# "how much to hire a jazz band", "jazz band for wedding cost" and the
# per-hour forms all autocomplete; the cost guide answers the trio and the
# duo in one section and no page answers the family in full. Every figure is
# a market token from _src/data/market-rates.json, thirteen of them added
# the same day from four 2026 guides; Signet publishes no price of its own.
# The post reads hours-first, because that is how the question is typed.
title: "What a jazz band costs in Denver"
seo_title: "What a jazz band costs in Denver (2026): duo, trio and quartet"
