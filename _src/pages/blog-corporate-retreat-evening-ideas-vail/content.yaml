  - type: subhead
    text: "The planner notes that decide all of this"

  - type: prose
    body: |
      Four mountain facts change what is possible, and all four are easier to
      settle months out than on the day.

      **Altitude.** Vail Village sits at 8,150 feet. Singers and horn players
      pace differently in thin, dry air, the temperature swing between sound
      check and the last set pulls instruments out of tune, and a longer
      sound check goes into the run of show because of it. Breckenridge at
      9,600 feet is the same story with more of it.

      **Sound limits.** Vail's outdoor limit in the resort villages was
      reported at 65 dBA measured ten feet from the permitted area, and the
      town was reviewing its rules as outdoor programming grew, so the
      current figure gets confirmed with the venue rather than assumed. A
      dinner set already sits at 65 to 72 dBA at the nearest table, which
      makes the cap a question about the late half of the evening rather than
      the early one.

      **Curfews and load-in.** The village cores are pedestrian. Cars stop at
      the parking structures, hotels receive vendors at docks on scheduled
      windows, and gear moves by freight elevator. The dock time, the
      elevator window and the route to the floor get agreed with the venue in
      writing before the day.

      **Travel.** A corridor date is a mountain highway with weather on it, a
      longer day than a Denver evening, and sometimes a night's lodging. It
      shows on a quote as its own line rather than folded into a fee.

      Every corridor number, cited and dated, is on our
      [mountain page](https://signetartists.com/planners/mountain/).

  - type: subhead
    text: "Where in the valley"

  - type: prose
    body: |
      Four towns take most of this calendar and each is a different evening
      to plan.

      [Vail](https://signetartists.com/corporate/retreats/vail/) is incentive
      and leadership-offsite country, with the village hotels running the
      general-session-by-day, dinner-by-night arc.
      [Beaver Creek](https://signetartists.com/corporate/retreats/beaver-creek/)
      is a terraced village where gear reaches some venues over snow, and it
      holds the on-mountain dinners.
      [Aspen](https://signetartists.com/corporate/retreats/aspen/) is the far
      end of the corridor, where the travel and lodging arithmetic is part of
      the decision rather than a footnote.
      [Breckenridge](https://signetartists.com/corporate/retreats/breckenridge/)
      is the historic-district option at 9,600 feet, and the one that most
      often hosts the whole group in one building.

      How we work every resort market, and what a retreat booking includes,
      is on the
      [corporate retreats page](https://signetartists.com/corporate/retreats/).

