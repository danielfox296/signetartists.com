sections:
  - type: key_takeaways
    items:
      - "The daytime programme plans itself. The evenings are the part people remember and the part that gets decided last."
      - "Eight evening activities that work in the valley, each with the size of act it actually needs."
      - "Vail's outdoor sound limit in the resort villages was reported at 65 dBA measured ten feet from the permitted area, and the town was reviewing its rules, so confirm the current number with the venue."
      - "A cover or jazz band for a corporate event runs {{market:us_corporate_band}} across this market, and a jazz trio or acoustic duo for a dinner runs {{market:us_dinner_band}}."

  - type: prose
    body: |
      Everyone remembers the same part of a retreat, and it is never the
      breakout session. It is the evening on the second night when the
      leadership team stopped performing at each other, the group from the
      Chicago office finally met the group from Denver, and somebody said
      something honest over dinner because the setting made it possible.

      Vail is unusually good at producing that evening. The valley is small
      enough that everyone walks to the same places, the light on the
      mountain does half the work, and the venues are built for groups. What
      follows is eight things to do with the evenings, ordered from the first
      night to the last, and then the planner notes that decide which of them
      actually work at your venue.

  - type: subhead
    text: "The welcome reception"

  - type: prose
    body: |
      The first evening has one job, which is to get people talking before
      the programme starts. Arrivals are staggered, half the group has never
      met in person, and the hour when everyone is standing with a drink is
      the hardest hour of the whole retreat to get right.

      Live players fix it more reliably than anything else, because music
      gives a standing crowd a reason to be in the same place and something
      to talk over. A duo at conversation volume, 65 to 72 dBA at the nearest
      table, is the size. Anything bigger turns an introduction into a
      shouting match.

  - type: subhead
    text: "The listening dinner"

  - type: prose
    body: |
      A seated dinner where the music stays under the conversation all night,
      lifts a little between courses, and stops when somebody stands up to
      speak. This is the evening that reads as expensive without anybody
      having to say so, and it is the one most retreats underspend on.

      Standards on upright bass and guitar are the usual answer. Our
      [jazz duo](https://signetartists.com/ensembles/jazz-duo-trio/) plays it
      as readily for an hour under a toast as for a whole evening under a
      table.

  - type: subhead
    text: "The awards night"

  - type: prose
    body: |
      If the retreat has recognition in it, the evening builds around a
      programme, and the music's job is to move people between its parts. A
      band plays them in, plays under the gaps while the next presenter walks
      up, and takes over when the last award is handed out.

      One practical requirement makes this work: a dedicated announcement
      microphone, live on its own channel from the end of sound check, so
      nobody borrows a singer's mic mid-speech. How music sits around a
      programme is set out in
      [playing around a programme](https://signetartists.com/blog/playing-around-a-program/).

  - type: subhead
    text: "The off-site dinner up the mountain"

  - type: prose
    body: |
      The valley's signature evening: a gondola or a snowcat, a cabin
      restaurant at altitude, and a group that spends the whole ride talking
      about the ride. It is the best story of the retreat and the hardest
      load-in on this list, because everything the evening needs goes up the
      same way your guests do.

      That constrains the music to what two people can carry, which in
      practice means a solo player or a duo with a compact rig. Ask the venue
      what fits in the cabin and what time the last ride down is, then plan
      the evening backwards from those two answers.

  - type: subhead
    text: "The set piece"

  - type: prose
    body: |
      One thing during the evening that nobody has seen at a company event
      before, which people photograph and then talk about at breakfast. A
      working flamenco trio playing real palos, with a dancer configuration
      when the night wants a floor show, is the version we field most often.

      It is a chapter of an evening rather than a whole one. Book it inside
      a dinner or a reception, not instead of one.
      [Dirty Flamenco](https://signetartists.com/ensembles/flamenco-trio/)
      is the act.

  - type: subhead
    text: "The closing night with a floor"

  - type: prose
    body: |
      The last evening is the one where the group actually lets go, and it
      wants a floor. A quartet is what a ballroom floor needs, playing dinner
      at conversation volume and getting loud on cue when the programme ends.

      The version that avoids two load-ins and two vendors is one act that
      grows across the night.
      [Tejas Singh](https://signetartists.com/artists/tejas-singh/) plays
      duo through arrival and dinner and becomes a quartet when the dancing
      starts, same voice, same songs, one contract, so guests hear one band
      getting bigger.

  - type: subhead
    text: "The late half after the band"

  - type: prose
    body: |
      Retreat crowds outlast bands, because nobody has to drive anywhere and
      the hotel is upstairs. A [DJ](https://signetartists.com/ensembles/dj/)
      carrying the back half through the same sound system on the same
      contract is how that gets covered without a second load-in. Because the
      setup is already in the building, adding it costs far less than a
      separate booking would.

  - type: subhead
    text: "The evening you leave alone"

  - type: prose
    body: |
      Three programmed nights in a row is one too many, and the planners who
      run retreats well know it. Leave one evening open, tell people it is
      open, and let the village do the work. Groups that get a free night
      arrive at the closing dinner with more to say to each other.

