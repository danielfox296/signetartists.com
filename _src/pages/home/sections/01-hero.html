<!-- Hero, rebuilt 2026-09-10 on Daniel's call: full-width, three black and
     white artist stills crossfading behind white type. Gary Meyers, Tejas
     Singh, Last Consulate. The stock stage still (img/hero.jpg), the service
     area eyebrow and the See Pricing button all left the hero that day; the
     range strip that leaned on the eyebrow moved down above the roster.
     Crossfade is CSS only (.hero-cine in styles.css), no controls, and
     reduced-motion users get the first frame held. Files in img/hero/,
     provenance in _src/data/media-sources.json. -->
<section class="hero-cine" aria-label="Signet Artists">
  <div class="hero-cine__frames" aria-hidden="false">
    <img class="hero-cine__frame" src="img/hero/gary-meyers.jpg" alt="Gary Meyers playing flamenco guitar beside a Spanish doorway, in black and white." width="1600" height="900" fetchpriority="high" decoding="async">
    <img class="hero-cine__frame" src="img/hero/tejas-singh.jpg" alt="Tejas Singh in profile, looking upward, in black and white." width="1600" height="900" decoding="async">
    <img class="hero-cine__frame" src="img/hero/last-consulate.jpg" alt="Last Consulate's artwork: a black and white prop passport held open in one hand." width="1600" height="900" decoding="async">
  </div>
  <div class="hero-cine__scrim" aria-hidden="true"></div>
  <div class="wrap hero-cine__copy">
    <h1 class="h1 display">{{brand_tagline}}</h1>
    <p class="hero-lede">{{brand_intro}}</p>
    <div class="btn-row">
      <a class="btn" href="music/">See Our Artists Roster</a>
    </div>
  </div>
</section>
