sections:
  - type: key_takeaways
    items:
      - "A cover or jazz band for a corporate event runs {{market:us_corporate_band}} in this market, and Denver bands run {{market:denver_band_range}}, a trio at the bottom of that and a full band with horns at the top."
      - "Most acts bill two things: a call-out covering the evening they commit to, whatever its length, and a rate for performance time. That's why one hour is never a quarter of four."
      - "Sound is the line that most often makes two quotes at the same number cover two different evenings. Ask whether it's inside the figure."
      - "Travel beyond the Denver metro and a December weekend are separate lines on a quote. A Denver holiday weekend carries {{market:denver_holiday_surcharge}} across this market."

  - type: prose
    body: |
      Two band quotes arrive a few hundred dollars apart. One includes sound and the other assumes the venue has it, travel is on one and missing from the other, and somebody upstairs wants a single figure to approve.

      That's the usual state of a corporate music budget, and it's why the market figures below are laid out by what each one covers.

      We don't publish our prices, because a Saturday in December and a
      Tuesday in September aren't the same job. What we can do is show you
      the market, sourced, so the budget conversation can happen today. Every
      figure below is somebody else's published number, with the page it came
      from listed at the end. For ours, tell us the date and we'll come back
      with a recommendation and a price.

  - type: subhead
    text: "Why the price has two parts"

  - type: prose
    body: |
      A **call-out** covers the evening we commit to, whatever its length.
      That means travel, load-in, setup, sound check, strike, load-out, and
      the production that rides along with all of it. An **hourly rate** then
      covers performance time.

      The split exists because of the short booking. A duo playing one hour of
      cocktails costs us the same evening a four-hour reception costs: the same
      drive, the same load-in, the same sound check, the same strike after the
      guests leave. Price it purely by the hour and the one-hour booking has to
      carry a rate nobody would agree to, or the four-hour booking has to
      subsidize it. Splitting the fee keeps both prices sensible, and it means
      the arithmetic on your quote is something you can check yourself.

  - type: subhead
    text: "What the market actually charges"

  - type: comparison_table
    title: "What the market charges, by size"
    columns: ["What you're booking", "What the market charges", "Whose market"]
    rows:
      - ["A jazz trio or acoustic duo for a dinner", "{{market:us_dinner_band}}", "United States"]
      - ["A cover or jazz band for a corporate event", "{{market:us_corporate_band}}", "United States"]
      - ["A Denver band, trio up to a full band with horns", "{{market:denver_band_range}}", "Denver"]
      - ["The four to six piece, the Denver middle", "{{market:denver_midtier_band}}", "Denver"]
      - ["A DJ carrying a night with production lighting", "{{market:denver_dj}}", "Denver"]
      - ["A seven to nine piece show band", "{{market:us_showband}}", "United States"]

  - type: prose
    body: |
      Read those next to what each one covers, because that's where two
      quotes at the same number stop being the same purchase. A booking
      marketplace averages {{market:denver_marketplace_avg}} for a Denver
      party band across listings running
      {{market:denver_marketplace_range}}.

      The other thing the table hides is size. A dinner for thirty and a
      ballroom of two hundred want different builds, and most corporate
      evenings need fewer musicians than the person booking them expects. The
      number moves far more on how many musicians are in the band and how
      many hours they play than on which act is standing there.

  - type: subhead
    text: "Two hours against four, which is how buyers actually ask"

  - type: prose
    body: |
      People search this question in hours: what it costs to hire a band for an hour, for two hours, for four. Hours are the unit the budget line is written in, so
      here's what the market charges, read that way.

      The first thing to know is that two hours isn't half of four, and the
      reason is the call-out above. A two-hour booking costs the act the same
      evening a four-hour booking costs: the same drive, the same load-in,
      the same sound check, the same strike after the guests leave. Only the
      playing time is halved, and playing time is the smaller half of the
      fee. A short booking is closer to two thirds of a long one than to half
      of it, which is why the short end of every published range sits higher
      than the arithmetic suggests it should.

  - type: comparison_table
    title: "What the market charges for a short booking and for a full evening"
    columns: ["What you're booking", "What the market charges", "Whose market"]
    rows:
      - ["A short booking, a ceremony or a cocktail hour", "{{market:denver_strings}}", "Denver"]
      - ["A jazz trio or acoustic duo for a dinner", "{{market:us_dinner_band}}", "United States"]
      - ["An acoustic duo across a four-hour evening", "{{market:us_duo}}", "United States"]
      - ["A trio across a four-hour evening", "{{market:us_trio}}", "United States"]
      - ["A cover or jazz band for a corporate evening", "{{market:us_corporate_band}}", "United States"]
      - ["Each hour past the contracted set", "{{market:denver_overtime}}", "Denver"]

  - type: prose
    body: |
      Read the two ends together. The Denver market puts a short ceremony or
      cocktail-hour booking at {{market:denver_strings}}, and a jazz trio or
      acoustic duo for a dinner at {{market:us_dinner_band}} nationally, the
      spread inside that second figure being how long the music plays and how
      much production travels with it. A four-hour evening moves to
      {{market:us_duo}} for an acoustic duo and {{market:us_trio}} for a trio
      across this market, and a cover or jazz band carrying a corporate
      evening runs {{market:us_corporate_band}}.

      For a two-hour corporate booking specifically, the useful anchor is the
      dinner figure, because a two-hour job is almost always a seated evening
      with remarks in it. Two musicians for two hours is the cheapest real
      booking on any of these lists, and it's the one most often
      over-specified: the quartet gets quoted for an evening that a duo would
      have carried.

      Going the other way, the market's price for time added on the night is
      {{market:denver_overtime}} for each hour past the contracted set. That
      line is worth asking about before you sign anything, because a four-hour
      quote that becomes a five-hour night is where a budget gets broken after
      the fact.

  - type: subhead
    text: "Three common configurations of a corporate night"

  - type: prose
    body: |
      A market range is abstract until somebody puts an evening against it.
      These are the three that come up most in a Denver corporate year, and
      the size each one actually needs.

      **A client dinner.** A jazz duo for three hours, sitting under the
      conversation for the whole evening so nobody has to raise their voice
      across the table. That's two musicians, low volume and no stage.

      **A holiday party with a real dance floor.** A quartet for four hours,
      playing dinner at conversation volume and getting loud on cue. Four
      musicians cover a ballroom floor; the horns and the second vocalist are
      what take a booking into show-band money.

      **A gala that runs across the whole night.** A quartet for three hours,
      a cocktail duo for the hour before it, and a DJ for the hour after. The
      thing worth knowing here is that covering all three from one booking is
      much cheaper than three separate ones, because the drive, the load-in
      and the sound system are paid for once. Ask any act you're comparing
      whether they price it that way.

  - type: subhead
    text: "Factors that affect price"

  - type: prose
    body: |
      Six things affect it, and each one should arrive as its own line on the
      quote and its own line on the contract. If they don't, that's the
      question to ask before you compare two numbers.

      - **Travel.** The Front Range is a short line. The I-70 corridor, which
        covers Vail, Beaver Creek, Breckenridge and Winter Park, is a longer
        one. Aspen, Telluride, Steamboat and Crested Butte add travel plus a
        night's lodging, billed as what it actually cost.
      - **Holiday and peak weekends.** A Denver holiday weekend carries
        {{market:denver_holiday_surcharge}} across this market.
      - **New Year's Eve.** Its own case everywhere, and it books earlier than
        anything else on the calendar.
      - **Live-band karaoke.** Its own line, if the program wants a chapter
        where your people sing and the band plays behind them.
      - **Learned songs.** The first one is included with us; each one after
        that is its own line.
      - **Overtime.** This market charges {{market:denver_overtime}} for each
        hour beyond the contracted set. We don't: added time costs what the
        earlier time did, in 30-minute increments, so if the night runs long
        the only question left is whether the crowd wants more.

  - type: subhead
    text: "The holiday calendar, worked through"

  - type: prose
    body: |
      The corporate season concentrates into eight weeks, so the December
      premium deserves its own paragraph. A Denver holiday weekend carries
      {{market:denver_holiday_surcharge}} across this market, applied to the
      fee for the music rather than to travel. On a strong December Saturday
      you should expect to be quoted above the ranges in the table above.
      New Year's Eve is its own case again, everywhere.

      There are [21 party dates across November and December](https://signetartists.com/corporate/holiday-party/denver/)
      in the Denver season, laid out on the
      [holiday party page](https://signetartists.com/corporate/holiday-party/).
      If you're still at the ideas stage,
      [the ideas list](https://signetartists.com/blog/office-holiday-party-ideas-denver/)
      runs seven party formats with a size attached to each.

  - type: subhead
    text: "What should live music cost for a company holiday party?"

  - type: prose
    body: |
      Budget {{market:us_corporate_band}} for a cover or jazz band, which is
      what this market charges for the format most holiday parties book, and
      {{market:denver_band_range}} if you want the Denver figure, a trio at the
      bottom of that and a full band with horns at the top. Then move the
      number for the date: a Denver holiday weekend carries
      {{market:denver_holiday_surcharge}} across this market, and New Year's
      Eve is its own case everywhere.

      If the party is a seated dinner rather than a dance floor, the figure
      is lower and the format is smaller: a jazz trio or acoustic duo
      for a dinner runs {{market:us_dinner_band}}. If it's a full evening
      with dancing in a ballroom, the four-hour figures above are the range
      you're in, and the horns and the second vocalist are what take a booking
      into show-band money at {{market:us_showband}}.

      Two lines decide whether the figure you take upstairs survives contact
      with the quote. They're sound, which is inside some numbers and a later
      conversation with others, and travel, which is a short line on the
      Front Range and a longer one over the passes. Ask about both before you
      compare two figures.

  - type: subhead
    text: "What's inside every one of those numbers"

  - type: prose
    body: |
      Comparing two band quotes is only possible once you know what each of
      them covers, and this is the part where quotes diverge most. At every
      size, ours includes:

      - Sound support that's the right size for the venue
      - Load-in, setup, strike and load-out
      - A certificate of insurance
      - A W-9 and one itemized invoice
      - Timeline coordination before the event
      - Continuous audio during breaks
      - A personal contact for the night

      Sound is the line worth checking hardest against another quote. A band
      that doesn't carry production will either add it later or expect the
      venue to have it, and the venue's house system was probably specified for
      speeches. Stage lighting and a dedicated engineer are optional add-ons,
      quoted as their own line when you want them.

  - type: aside
    title: "Who approves the number"
    body: |
      In almost every corporate booking the person choosing the band and the
      person approving the spend are two different people, and they're rarely
      in the same meeting, so the market figures here are written to be forwarded,
      questioned and approved without anybody waiting on a vendor to reply.

      Our musicians have played for Amazon, NBCUniversal, Charles Schwab,
      Kroger, the Denver Art Museum, Sheraton, Hyatt, the Washington
      Nationals, Casa Bonita and Monarch Casino.

  - type: subhead
    text: "How far ahead should this be booked?"

  - type: prose
    body: |
      Corporate holiday parties tend to get decided between August and October
      for November and December dates. New Year's Eve goes earliest of all.
      Galas run longer, closer to ten or twelve months, and a mountain
      venue or a fall Saturday runs twelve to eighteen.

      If your date is already fixed, the useful thing to know is that you can
      check a date with us without a conversation about budget first.

