title: "What live music costs for a corporate event"
slug: "what-live-music-costs-corporate-event"
eyebrow: "CORPORATE"
dek: "A band's price has two parts. Here is what each one covers, what moves it, and what the total comes to for the shapes a Denver corporate night actually takes."
date: "2026-08-05"
last_updated: "2026-08-27"
author:
  name: "Signet Artists"
meta_description: "What a live band costs for a Denver corporate event: the market runs $2,500 to $8,000, how a quote is built, and what travel and December add."

hero:
  src: "img/hero.jpg"
  alt: "Stage lights over instruments set up before an evening event."

sections:
  - type: key_takeaways
    items:
      - "A cover or jazz band for a corporate event runs {{market:us_corporate_band}} in this market, and Denver bands run {{market:denver_band_range}}, a trio at the bottom of that and a full band with horns at the top."
      - "Most acts bill two things: a call-out covering the evening they commit to whatever its length, and a rate for performance time. That is why one hour is never a quarter of four."
      - "Sound is the line that most often makes two quotes at the same number cover two different evenings. Ask whether it is inside the figure."
      - "Travel beyond the Denver metro and a December weekend are separate lines on an honest quote. A Denver holiday weekend carries {{market:denver_holiday_surcharge}} across this market."

  - type: prose
    body: |
      The question usually arrives without much warning. Someone decides the
      holiday party should have a band this year, and by the end of that
      meeting you are the person who has to find out what a band costs and
      report back with a figure somebody upstairs can approve.

      Then you start looking, and almost every band site answers with a form.
      You fill it in, you wait two days, and a number comes back that you
      cannot compare against the next number, because the two quotes cover
      different things. One includes sound. One does not. One mentions travel.
      One will mention it later. Three weeks go by and you still cannot put a
      line in a budget.

      We do not publish our prices, because a Saturday in December and a
      Tuesday in September are not the same job and one figure would be wrong
      for most of the nights somebody read it on. What we can do is show you
      the market, sourced, so the budget conversation can happen today. Every
      figure below is somebody else's published number, with the page it came
      from listed at the end. For ours, the date is the whole question, so that
      is what we ask for first.

  - type: subhead
    text: "Why the price has two parts"

  - type: prose
    body: |
      A **call-out** covers the evening we commit to, whatever its length.
      Travel, load-in, setup, sound check, strike, load-out, and the
      production that rides along with all of it. An **hourly rate** then
      covers performance time.

      The split exists because of the short booking. A duo playing one hour of
      cocktails costs us the same evening a four-hour reception costs: the same
      drive, the same load-in, the same sound check, the same strike after the
      guests leave. Price it purely by the hour and the one-hour booking has to
      carry a rate nobody would agree to, or the four-hour booking has to
      subsidise it. Splitting the fee lets both come out honest, and it means
      the arithmetic on your quote is something you can check yourself.

  - type: subhead
    text: "What the market actually charges"

  - type: comparison_table
    title: "What the market charges, by size"
    columns: ["What you are booking", "What the market charges", "Whose market"]
    rows:
      - ["A jazz trio or acoustic duo for a dinner", "{{market:us_dinner_band}}", "United States"]
      - ["A cover or jazz band for a corporate event", "{{market:us_corporate_band}}", "United States"]
      - ["A Denver band, trio up to a full band with horns", "{{market:denver_band_range}}", "Denver"]
      - ["The four to six piece, the Denver middle", "{{market:denver_midtier_band}}", "Denver"]
      - ["A DJ carrying a night with production lighting", "{{market:denver_dj}}", "Denver"]
      - ["A seven to nine piece show band", "{{market:us_showband}}", "United States"]

  - type: prose
    body: |
      Read those next to what each one covers, because that is where two
      quotes at the same number stop being the same purchase. A booking
      marketplace averages {{market:denver_marketplace_avg}} for a Denver
      party band across listings running
      {{market:denver_marketplace_range}}, and what sits inside a listing at
      that price varies listing by listing.

      The other thing the table hides is size. A dinner for thirty and a
      ballroom of two hundred want different builds, and most corporate
      evenings need fewer players than the person booking them expects. The
      number moves far more on how many people are on the stand and how many
      hours they play than on which act is standing there.

  - type: subhead
    text: "Three shapes a corporate night takes"

  - type: prose
    body: |
      A market range is abstract until somebody puts an evening against it.
      These are the three that come up most in a Denver corporate year, and
      the size each one actually needs.

      **A client dinner.** A jazz duo, three hours, sitting under the
      conversation for the whole evening so nobody has to raise their voice
      across the table. Two players, low volume, no stage. This is the
      cheapest real booking on the list and it is the one most often
      over-specified.

      **A holiday party with a real dance floor.** A quartet, four hours,
      playing dinner at conversation volume and getting loud on cue. Four
      players covers a ballroom floor; the horns and the second vocalist are
      what take a booking into show-band money.

      **A gala that runs across the whole night.** A quartet for three hours,
      a cocktail duo for the hour before it, and a DJ for the hour after. The
      thing worth knowing here is that covering all three from one booking is
      much cheaper than three separate ones, because the drive, the load-in
      and the sound system are paid for once. Ask any act you are comparing
      whether they price it that way.

  - type: subhead
    text: "What moves the number"

  - type: prose
    body: |
      Five things, each of which should arrive as its own line on the quote
      and its own line on the contract. If they do not, that is the question
      to ask before you compare two numbers.

      - **Travel.** The Front Range is a short line. The I-70 corridor, which
        covers Vail, Beaver Creek, Breckenridge and Winter Park, is a longer
        one. Aspen, Telluride, Steamboat and Crested Butte add travel plus a
        night's lodging, billed as what it actually cost.
      - **Holiday and peak weekends.** A Denver holiday weekend carries
        {{market:denver_holiday_surcharge}} across this market.
      - **New Year's Eve.** Its own case everywhere, and it books earlier than
        anything else on the calendar.
      - **Live-band karaoke.** Its own line, if the program wants a chapter
        where your people sing and the band plays behind them.
      - **Learned songs beyond the first.** The first one is included with us;
        each one after that is its own line.
      - **Overtime.** This market charges {{market:denver_overtime}} for time
        beyond the contracted set. We do not: added time costs what the
        earlier hours did, in 30-minute increments, so at eleven o'clock the
        only question is whether the crowd wants another half hour.

  - type: subhead
    text: "The holiday calendar, worked through"

  - type: prose
    body: |
      The corporate season concentrates into eight weeks, so the December
      premium deserves its own paragraph. A Denver holiday weekend carries
      {{market:denver_holiday_surcharge}} across this market, applied to the
      fee for the music rather than to travel. On a strong December Saturday
      you should expect to be quoted above the ranges in the table above, and
      an act that does not tell you that in advance is going to tell you later.
      New Year's Eve is its own case again, everywhere.

      There are [21 party dates across November and December](https://signetartists.com/corporate/holiday-party/denver/)
      in the Denver season, laid out on the
      [holiday party page](https://signetartists.com/corporate/holiday-party/).
      If you are still at the ideas stage rather than the date stage,
      [the ideas list](https://signetartists.com/blog/office-holiday-party-ideas-denver/)
      runs seven party shapes with a size attached to each.

  - type: subhead
    text: "What is inside every one of those numbers"

  - type: prose
    body: |
      Comparing two band quotes is only possible once you know what each of
      them covers, and this is the part where quotes diverge most. At every
      size, ours includes:

      - Sound sized to the venue
      - Load-in, setup, strike and load-out
      - A certificate of insurance naming your venue as additional insured
      - A W-9 and one itemised invoice
      - Timeline coordination before the event
      - Continuous audio during breaks
      - A named contact for the night, given to you before the event

      Sound is the line worth checking hardest against another quote. A band
      that does not carry production will either add it later or expect the
      venue to have it, and the venue's house system was probably specified for
      speeches. Stage lighting and a dedicated engineer are optional add-ons,
      quoted as their own line when you want them.

  - type: aside
    title: "Why any of this is published"
    body: |
      In almost every corporate booking the person choosing the band and the
      person approving the spend are two different people, and they are rarely
      in the same meeting. That is the reason this page exists: the market
      figures on it can be forwarded, questioned and approved without anybody
      waiting on a vendor to reply. What we will not do is publish a single
      number of our own and let you find out later that it did not apply to
      your date. Send the date, and the figure you take to finance is the one
      that ends up on the invoice.

  - type: subhead
    text: "How far ahead should this be booked?"

  - type: prose
    body: |
      Corporate holiday parties tend to get decided between August and October
      for November and December dates. New Year's Eve goes earliest of all.
      Galas run longer, closer to ten or twelve months, and a mountain
      venue or a fall Saturday runs twelve to eighteen.

      If your date is already fixed, the useful thing to know is that a date
      can be checked without a conversation about budget first.

