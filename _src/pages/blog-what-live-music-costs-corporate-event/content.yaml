title: "What live music costs for a corporate event"
slug: "what-live-music-costs-corporate-event"
eyebrow: "CORPORATE"
dek: "A band's price has two parts. Here is what each one covers, what moves it, and what the total comes to for the shapes a corporate night actually takes."
date: "2026-08-05"
last_updated: "2026-08-18"
author:
  name: "Signet Artists"
meta_description: "How a live band's price for a corporate event is built: call-out plus hourly, worked totals from duo to quartet, and what travel and holiday dates add."

hero:
  src: "img/headliners.jpg"
  alt: "A snare drum with sticks laid across it and a close microphone."

sections:
  - type: key_takeaways
    items:
      - "A band's fee splits into a call-out, which covers the evening, and an hourly rate, which covers the music."
      - "Our published totals run from $1,050 for a single hour of duo, or $1,150 for a DJ, up to $4,800 for a quartet over four hours."
      - "Most corporate parties land between $1,500 and $5,500, which is a DJ or a duo at the bottom and a quartet through the whole evening at the top."
      - "Travel, holiday weekends and New Year's Eve are separate lines. Nothing about them is folded into the headline number."

  - type: prose
    body: |
      The question usually arrives without much warning. Someone decides the
      holiday party should have a band this year, and by the end of that
      meeting you are the person who has to find out what a band costs and
      report back with a figure somebody upstairs can approve.

      Then you start looking, and almost every band site answers with a form.
      You fill it in, you wait two days, and a number comes back that you
      cannot compare against the next number, because the two quotes cover
      different things. One includes sound. One does not. One mentions travel.
      One will mention it later. Three weeks go by and you still cannot put a
      line in a budget.

      Our rates sit on the [pricing page](https://signetartists.com/pricing/),
      in full, with no form in front of them. This is the explanation that
      belongs beside them.

  - type: subhead
    text: "Why the price has two parts"

  - type: prose
    body: |
      A **call-out** covers the evening we commit to, whatever its length.
      Travel, load-in, setup, sound check, strike, load-out, and the
      production that rides along with all of it. An **hourly rate** then
      covers performance time.

      The split exists because of the short booking. A duo playing one hour of
      cocktails costs us the same evening a four-hour reception costs: the same
      drive, the same load-in, the same sound check, the same strike after the
      room empties. Price it purely by the hour and the one-hour booking has to
      carry a rate nobody would agree to, or the four-hour booking has to
      subsidise it. Splitting the fee lets both come out honest, and it means
      the arithmetic on your quote is something you can check yourself.

  - type: subhead
    text: "What the totals actually are"

  - type: comparison_table
    title: "Published rates, Denver metro, standard date"
    columns: ["Ensemble", "Call-out", "Per hour", "2 hours", "3 hours", "4 hours"]
    rows:
      - ["Duo", "$600", "$450", "$1,500", "$1,950", "$2,400"]
      - ["Trio", "$1,000", "$600", "$2,200", "$2,800", "$3,400"]
      - ["Quartet", "$1,600", "$800", "$3,200", "$4,000", "$4,800"]
      - ["DJ", "$800", "$350", "$1,500", "$1,850", "$2,200"]

  - type: prose
    body: |
      Every cell in that table is the call-out plus the hourly rate times the
      hours. There is no cell doing anything else.

      A duo, trio or DJ can be booked for a single hour, and a single hour is
      the call-out plus one hour of performance: $1,050 for the duo, $1,600
      for the trio, $1,150 for the DJ. A quartet's minimum is two hours, which
      is why the table starts there. A five to six piece is quoted by request
      rather than from this table, at $6,000 to $8,000 in Denver on the
      published rate card.

  - type: stat_callout
    number: "$1,500 to $5,500"
    label: "Where most corporate parties land. A DJ or a duo covering the night at the bottom of that range, a quartet through the whole evening at the top, with sound and a named contact for the night inside both figures."
    source: "Signet Artists published rates, signetartists.com/pricing/"

  - type: subhead
    text: "Three shapes a corporate night takes"

  - type: prose
    body: |
      Rate cards are abstract until somebody puts an evening against them.
      These are the three that come up most.

      **A client dinner.** A jazz duo, three hours, sitting under the
      conversation for the whole evening so nobody has to raise their voice
      across the table. Call-out $600, three hours at $450. **$1,950.**

      **A holiday party with a real dance floor.** A quartet, four hours,
      playing dinner at conversation volume and getting loud on cue.
      Call-out $1,600, four hours at $800. **$4,800.**

      **A gala that runs across the whole night.** A quartet for three
      hours, a cocktail duo for the hour before it, and a DJ for the hour
      after. Once we are in the building the setup is already paid for, so the
      added slots bill at the hourly rate with no second call-out, and booking
      three parts of the night together takes 10% off.

  - type: comparison_table
    title: "The gala, itemised"
    columns: ["Line", "Amount"]
    rows:
      - ["Quartet call-out", "$1,600"]
      - ["Performance, 3 hours at $800 an hour", "$2,400"]
      - ["Cocktail duo, 1 hour, no second call-out", "$450"]
      - ["DJ after the band, 1 hour, no second call-out", "$350"]
      - ["Three parts booked together, 10% off", "-$480"]
      - ["Total", "$4,320"]

  - type: prose
    body: |
      That is a five-hour evening with three different musical settings for
      less than the quartet on its own costs over four. The arithmetic is what
      makes it cheaper, and you can do the arithmetic yourself before you call
      anybody.

  - type: subhead
    text: "What moves the number"

  - type: prose
    body: |
      Five things, each of which arrives as its own line on the quote and its
      own line on the contract.

      - **Travel.** The Front Range adds $300. The I-70 corridor, which covers
        Vail, Beaver Creek, Breckenridge and Winter Park, adds $600. Aspen,
        Telluride, Steamboat and Crested Butte add $600 plus lodging at cost,
        billed as what it actually cost.
      - **Holiday and peak weekends.** Add 25% to the fees, before travel.
      - **New Year's Eve.** Adds 50%, and books earlier than anything else on
        the calendar.
      - **Live-band karaoke.** $1,500, if the program wants a chapter where
        your people sing and the band plays behind them.
      - **Learned songs beyond the first.** $250 each.

      One thing that does not move it: overtime. There is no overtime rate.
      Added time bills at the same hourly figure in 30-minute increments, so
      hour five costs what hour four cost. At eleven o'clock the only question
      on the table is whether the room wants another half hour.

  - type: subhead
    text: "What is inside every one of those numbers"

  - type: prose
    body: |
      Comparing two band quotes is only possible once you know what each of
      them covers, and this is the part where quotes diverge most. At every
      size, ours includes:

      - Sound sized to the room
      - Load-in, setup, strike and load-out
      - A certificate of insurance naming your venue as additional insured
      - A W-9 and one itemised invoice
      - Timeline coordination before the event
      - Continuous audio during breaks
      - A named contact for the night, given to you before the event

      Sound is the line worth checking hardest against another quote. A band
      that does not carry production will either add it later or expect the
      venue to have it, and the venue's house system was probably specified for
      speeches. Stage lighting and a dedicated engineer are optional add-ons,
      quoted as their own line when you want them.

  - type: aside
    title: "Why any of this is published"
    body: |
      In almost every corporate booking the person choosing the band and the
      person approving the spend are two different people, and they are rarely
      in the same meeting. A rate you have to request is a rate you cannot
      forward. Putting the whole ladder on a public page means the figure you
      take to finance is the same figure that ends up on the invoice, and you
      did not have to spend a week of back-and-forth to get it.

  - type: subhead
    text: "How far ahead should this be booked?"

  - type: prose
    body: |
      Corporate holiday parties tend to get decided between August and October
      for November and December dates. New Year's Eve goes earliest of all.
      Galas and mountain-venue bookings run longer, closer to ten or twelve
      months, and a fall Saturday in the corridor is the hardest date in the
      Colorado calendar to hold.

      If your date is already fixed, the useful thing to know is that a date
      can be checked without a conversation about budget first.

