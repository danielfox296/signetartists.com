  - type: stat_callout
    number: "{{market:us_corporate_band}}"
    label: "What a cover or jazz band costs for a corporate event across this market. The figure moves on how many players are on the stand and how many hours they play, far more than on which act is standing there."
    source: "Livent Group, 2026 live band cost guide"

  - type: subhead
    text: "What the calendar does to the number"

  - type: prose
    body: |
      Denver holiday parties get decided between August and October, and the
      calendar does most of the moving. There are
      [21 party dates across November and December](https://signetartists.com/corporate/holiday-party/denver/),
      Thursdays through Saturdays, and a peak December date costs more than a
      standard one everywhere in this market: a Denver holiday weekend carries
      {{market:denver_holiday_surcharge}}. New Year's Eve is its own case
      again, and it books earlier than anything else on the calendar.

      {{market_sources}}

      The season's dates, with the peak ones marked, are laid out on the
      [holiday party page](https://signetartists.com/corporate/holiday-party/),
      and whether yours is free is a two-line email: the date and the venue.

  - type: aside
    title: "If the venue is not booked yet either"
    body: |
      The entertainment decision and the venue decision usually run in
      parallel, and the venue's fine print moves the music budget more than
      most planners expect: in-house catering mandates, start-time rules and
      load-in windows all live in the venue contract. The
      [Denver venue guide](https://signetartists.com/blog/corporate-holiday-party-venues-denver/)
      reads sixteen of this market's venues the way we read a space before
      we play it.

