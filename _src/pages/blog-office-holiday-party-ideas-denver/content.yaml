    title: "The seven ideas and what each one books"
    columns: ["The idea", "The booking", "Where it sits"]
    rows:
      - ["The DJ night", "DJ, four hours", "The cheapest way to cover a whole evening"]
      - ["The jazz duo dinner", "Jazz duo, three hours", "A seated night with a toast in it"]
      - ["The in-office afternoon", "Acoustic duo, one hour", "The smallest real booking on the list"]
      - ["The dance floor", "Quartet, four hours", "A ballroom floor that has to fill"]
      - ["The band into the DJ", "Quartet three hours, DJ hour after", "A crowd that will outlast the band"]
      - ["Live-band karaoke", "Added to any band booking", "A chapter, not a whole night"]
