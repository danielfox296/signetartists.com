sections:
  - type: key_takeaways
    items:
      - "Every idea here is a format with a published rate, so the pitch and the price arrive together. The full card is on the pricing page."
      - "Most Denver office parties land between $1,500 and $5,500. The bottom of that range is a DJ or a duo. The top is a quartet carrying the whole evening."
      - "Denver holiday dates get decided between August and October. The peak December dates price at plus 25 percent, New Year's Eve at plus 50."
      - "The venue is a separate decision from the entertainment. Sixteen venues that host this market are read one by one in our venue guide."

  - type: prose
    body: |
      The assignment usually lands sideways. Someone in a Tuesday meeting
      decides the holiday party should be better this year, and by Thursday
      it is yours. Ideas are not the hard part. The hard part is that ideas
      lists never come with numbers, so every option you bring back opens a
      second research project into what it costs, and the party gets planned
      at the speed of the slowest quote.

      This list runs the other way. Each idea below is a format we publish a
      rate for, so the figure is attached to the idea the day you pitch it.
      The arithmetic behind every number is set out in
      [what live music costs for a corporate event](https://signetartists.com/blog/what-live-music-costs-corporate-event/),
      and the whole card sits on the
      [pricing page](https://signetartists.com/pricing/). Where the party
      goes is its own decision, and the sixteen venues that host this market
      are read one by one in
      [the Denver venue guide](https://signetartists.com/blog/corporate-holiday-party-venues-denver/).

  - type: subhead
    text: "The DJ night"

  - type: prose
    body: |
      The most common single booking of the Denver corporate season, and the
      simplest to approve: one line, one load-in, the whole night covered.
      An [open-format DJ](https://signetartists.com/ensembles/dj/) reads the
      crowd from the first drink to the last song, and the published figure
      for four hours is $2,200: an $800 call-out plus $350 an hour.

      This is the idea to pitch when the budget line is the point. It is the
      smallest number on this page that covers an entire evening, and it
      scales to whatever the venue holds.

  - type: subhead
    text: "The jazz duo dinner"

  - type: prose
    body: |
      For the party that is really a dinner: a seated evening, a toast or
      two, and conversation as the main event. The
      [jazz duo](https://signetartists.com/ensembles/jazz-duo-trio/) plays
      standards on upright bass and guitar at 65 to 72 dBA at the nearest
      table, which is a level people talk across without leaning in. Three
      hours runs $1,950: a $600 call-out plus $450 an hour.

      If the group outgrows the duo, the trio adds drums played with brushes
      for larger floors, and the same arithmetic carries: $1,000 call-out,
      $600 an hour.

  - type: subhead
    text: "The in-office afternoon"

  - type: prose
    body: |
      Not every office party leaves the office, and the format that fits a
      catering spread on the main floor at four o'clock is a small one. A
      single hour of the
      [acoustic duo](https://signetartists.com/ensembles/acoustic-duo/) is
      $1,050, voice and guitar playing covers people know at a volume they
      can talk across. A
      [solo guitarist](https://signetartists.com/ensembles/solo-guitarist/)
      runs $900 to $1,200 for the evening and sets up in 6 by 4 feet, which
      is to say: next to the espresso machine, without moving the desks.

  - type: subhead
    text: "The dance floor"

  - type: prose
    body: |
      The party people retell is usually the one where the floor filled. A
      quartet through a four-hour evening is $4,800, playing dinner at
      conversation volume and getting loud on cue when the program ends and
      the night turns.

      The version of this we book most is
      [Tejas Singh](https://signetartists.com/artists/tejas-singh/): a duo
      through arrival and dinner that grows to a quartet when the dancing
      starts, same voice, same songs, one contract. Guests hear one band
      getting bigger rather than two acts swapping over.

  - type: subhead
    text: "The band into the DJ"

  - type: prose
    body: |
      The full-evening shape for a crowd that will outlast the band: a
      quartet for three hours, then a
      [DJ](https://signetartists.com/ensembles/dj/) carrying the late end
      through the same sound system on the same contract. Because the setup
      is already paid for, the DJ hour bills at the hourly rate with no
      second call-out. Quartet call-out $1,600, three hours at $800, one DJ
      hour at $350: $4,350 for a five-hour evening with two different kinds
      of music in it.

  - type: subhead
    text: "Live-band karaoke"

  - type: prose
    body: |
      The one on this list guests talk about in January. The band learns the
      songs, your people sing them, and the floor belongs to whoever is
      brave enough to take it. It books as a chapter of the night added to
      any band booking, published at $1,500 on the
      [extras list](https://signetartists.com/pricing/).

      It works because the star of an office party is never the band. It is
      the account manager doing a shockingly competent Springsteen.

  - type: subhead
    text: "The set piece"

  - type: prose
    body: |
      Some parties want one thing guests photograph, and a format none of
      them have seen at an office party before.
      [Dirty Flamenco](https://signetartists.com/ensembles/flamenco-trio/)
      is that booking: real palos played by a working flamenco trio, from
      $2,800 in Denver, with a dancer configuration when the night wants a
      floor show. It turns the entertainment from background into the thing
      the party was.

