llms_description: "Seven priced office holiday party ideas for Denver: DJ night $2,200 for four hours, jazz duo dinner $1,950 for three, acoustic duo hour $1,050, quartet dance floor $4,800, band-into-DJ evening $4,350, live-band karaoke plus $1,500, flamenco set piece from $2,800."

