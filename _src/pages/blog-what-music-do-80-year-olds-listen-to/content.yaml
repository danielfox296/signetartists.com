        url: "https://doi.org/10.1177/2059204320965058"
      - text: "Burunat, I., and others (2025). Memory bumps across the lifespan in personally meaningful music. Memory."
        url: "https://doi.org/10.1080/09658211.2025.2557960"
      - text: "Krumhansl, C. L., and Zupnick, J. A. (2013). Cascading reminiscence bumps in popular music. Psychological Science."
        url: "https://doi.org/10.1177/0956797613486486"
      - text: "Krumhansl, C. L. (2017). Listening niches across a century of popular music. Frontiers in Psychology."
        url: "https://doi.org/10.3389/fpsyg.2017.00431"
      - text: "Platz, F., Kopiez, R., Hasselhorn, J., and Wolf, A. (2015). The impact of song-specific age and affective qualities of popular songs on music-evoked autobiographical memories. Musicae Scientiae."
        url: "https://doi.org/10.1177/1029864915597567"

