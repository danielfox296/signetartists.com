# ---------------------------------------------------------------------------
# Research post, drafted 2026-10-04 (the music-and-behavior series, second
# batch). Evidence for the title: Google suggests "why do restaurants have
# live music", "live music in restaurants", "benefits of live music" and
# "why is restaurant music so loud" (read 2026-10-04). The subheads carry
# the question forms.
# THE ONE READER: the owner or manager of a restaurant, a hotel bar or a
# lounge who is deciding whether a regular night of live music is worth it.
# Every study and number comes from the writer's fact sheet (V1 entries in
# research/music-behavior-2026-10/). Straight about what is shown: music
# changes how long guests stay, the studies disagree on what they spend, and
# no study was found comparing live with recorded music on a restaurant's
# sales. No Signet price and no promise of revenue. The weekly program page
# is a private share Daniel hands to venues, so this post does not link it
# or sit under it: it sits under the public brunch page, which already
# speaks to restaurants, and says only what that page says.
# ---------------------------------------------------------------------------
title: "Why do restaurants have live music?"
seo_title: "Why do restaurants have live music? What it does for a restaurant or bar"
slug: "why-do-restaurants-have-live-music"
eyebrow: "RESEARCH"
parent: "daytime/brunch/"
dek: "What studies of restaurants and bars found about music, how long guests stay and what they spend, how loud it should be, and what's known about live music in particular."
date: "2026-10-04"
author:
  name: "Signet Artists"
meta_description: "Why restaurants have live music: what studies found about music, how long guests stay and what they spend, how loud it should be, and what isn't known."
llms_description: "A research summary from a Denver live-music booking company for the owner or manager of a restaurant, hotel bar or lounge deciding whether a regular night of live music is worth it. In a 2024 field experiment across 282 tables at an Italian restaurant in Tel Aviv, tables stayed about 80 minutes with slow music, about 69 with the restaurant's usual playlist and about 57 with fast music, and the size of the check did not change. A 1986 study in one American restaurant found the same about time and reported more bar spending with slow music, which the 2024 experiment did not find. A 2002 study in Glasgow found that how much diners liked the music predicted their stay better than its tempo, and that time at the table best predicted spending. In a 2022 study of 248 people in a Finnish cafeteria, meals lasted longer with any sound than in silence. Two 2003 single-restaurant studies linked classical music with more spending per head in Britain and jazz, pop or classical with a higher stated willingness to pay in Sydney. A 2003 California study found larger checks with soft music than loud, and acoustics research recommends background music at no more than 60 to 65 decibels, a level two people can talk across. A 2018 study of a public square in Harbin, China, found people walked more slowly near music and sat closer to it, and a 2019 study found an audience moved more at a live show than to the same album played back. The company found no study comparing live with recorded music on a restaurant's or bar's sales. The company books solo musicians and duos for restaurants, hotel bars and lounges, for one night or a standing night."

