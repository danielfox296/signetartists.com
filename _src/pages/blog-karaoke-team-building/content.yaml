  src: "img/hero.jpg"
  alt: "Stage lights over instruments set up before an evening event."

sections:
  - type: key_takeaways
    items:
      - "We didn't find a study of karaoke at a company event. The closest research is on singing classes, a choir and a dance experiment."
      - "In those studies, singing together seemed to help people feel close quickly, including in a choir of 232 where most people didn't know each other."
      - "In a 2016 dance experiment, the groups that felt closer didn't cooperate any better on a game afterwards, and researchers in the field have warned that some of these effects haven't held up when repeated."

  - type: prose
    body: |
      Someone who hardly says a word in meetings takes the microphone, and by
      the second chorus the whole team is singing with them. That's the moment you're
      hoping for when you put karaoke on a team evening. If you're
      weighing it for an offsite, it's worth asking whether it does
      anything for the team once the night's over.

  - type: subhead
    text: "Is karaoke good for team building?"

  - type: prose
    body: |
      It can be, if what you want is for people to get comfortable with each
      other. We didn't find a study of karaoke at a company event, so we
      looked at the closest research we could find, on singing classes, a
      choir and a dance experiment.

      Music may also give people something easy to talk about. In a 2006
      study, when strangers were asked to get to know each other, music was
      the topic they talked about most. So a night of songs everyone knows can
      give people a way into a conversation, even the ones who never go near
      the microphone.

  - type: subhead
    text: "Does singing together bring a team closer?"

  - type: prose
    body: |
      It seems to help people feel close to each other fairly quickly. In a
      2015 British study, 135 adults aged 18
      to 83 joined new adult-education classes, some in singing and some in
      crafts or creative writing. After the first month, the people in the
      singing classes felt closer to their classmates than the people in the
      other classes did. By the third month, the other classes had caught
      up. People picked
      their own classes, though, which makes it harder to be sure the
      singing was what made the difference.

      It seemed to work in a big group, too. In a 2016 study, a London
      community choir rehearsed in small groups of 20 to 80 and as one choir
      of 232. After 90 minutes of singing, people felt more connected in
      both, and the jump in closeness was bigger in the big choir, where most
      people didn't know each other. That's a good sign for a company party
      where people from different teams may never have met.

  - type: subhead
    text: "Does it make a team work together better?"

  - type: prose
    body: |
      As far as we can tell, nobody has shown that it does. In a 2016 Oxford
      study, 94 people danced in groups of four strangers, each of them
      hearing music on headphones. The groups that danced the same moves in
      time with each other said they felt closer afterwards. When the
      researchers then gave them a game that measures cooperation, there was
      no difference between the groups. That was dancing, and it's the
      closest test we found of whether feeling closer turns into working
      together better.

      Some researchers who study music have urged caution, too. In 2022,
      three of them pointed out that most studies of people
      doing things in time together don't guard against the experimenters'
      own expectations of how things will turn out. When other labs repeated
      the experiments with more safeguards, several didn't find the original
      effects.

      If your main goal for the evening is getting people comfortable with
      each other, feeling closer may be enough.

  - type: subhead
    text: "What is live band karaoke?"

  - type: prose
    body: |
      [Live band karaoke](https://signetartists.com/ensembles/live-band-karaoke/)
      is karaoke with a live band behind the singer instead of a backing
      track. The band plays the 80s and 90s hits on its own and hands the
      microphone to anyone who wants a song. The words are on a screen, a
      host works the floor, and the band follows whoever is singing and keeps
      the song going if they lose the verse. Two or three coworkers can go up
      together on one song, and nobody has to sing who doesn't want to.

      Companies book it for a team evening in Denver or on a
      [mountain retreat](https://signetartists.com/corporate/retreats/). If
      you're still planning the rest of the offsite, we also have some
      [company offsite ideas for remote teams](https://signetartists.com/blog/company-offsite-ideas-colorado-remote-teams/).

