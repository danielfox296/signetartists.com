# ---------------------------------------------------------------------------
# Research post, drafted 2026-10-04 (the music-and-behavior series, second
# batch). Evidence for the title: Google suggests "karaoke team building",
# "karaoke team building ideas", "karaoke team bonding", "karaoke team
# building games" and "is karaoke good for you" (read 2026-10-04). The
# subheads carry the question forms.
# THE ONE READER: whoever is planning a team offsite or a company evening
# and is weighing karaoke as the thing that gets people who don't know each
# other well to loosen up.
# Every study comes from the writer's fact sheet (V1 entries in
# research/music-behavior-2026-10/). No study of karaoke at a company event
# was found, and the post says so. Nothing promises better teamwork: the one
# experiment that tested cooperation found no difference, and the 2022
# caution paper is reported. What live band karaoke is comes from its own
# page (ensembles-live-band-karaoke), stated once and linked once.
# ---------------------------------------------------------------------------
title: "Karaoke team building"
seo_title: "Karaoke team building: does singing together bring a team closer?"
slug: "karaoke-team-building"
eyebrow: "RESEARCH"
parent: "corporate/retreats/"
dek: "What researchers found about singing together and feeling close, what they haven't shown about teamwork, and how live band karaoke works for a team evening."
date: "2026-10-04"
author:
  name: "Signet Artists"
meta_description: "Is karaoke good for team building? What studies of singing together show about feeling close, what they don't show about teamwork, and live band karaoke."
llms_description: "A research summary from a Denver live-music booking company for anyone weighing karaoke for a team offsite or a company evening. The company found no study of karaoke at a company event. In a 2015 British study of 135 adults, people in new singing classes felt closer to their classmates after the first month than people in craft or creative-writing classes, who caught up by the third month; people chose their own classes. In a 2016 study of a London community choir, people felt more connected after 90 minutes of singing in groups of 20 to 80 and in one choir of 232, with a bigger jump in the large choir, where most people didn't know each other. A 2006 study found music was the topic strangers talked about most when asked to get to know each other. In a 2016 Oxford study of 94 people dancing in groups of four, the groups that danced in time said they felt closer but did no better on a cooperation game, and a 2022 paper by three music researchers warned that most studies of doing things in time together don't guard against the experimenters' expectations and that several effects were not found again when repeated with more safeguards. The post concludes that singing together seems to help people feel closer quickly but hasn't been shown to make a team cooperate better, and describes live band karaoke, where a guest sings with a live band instead of a backing track."

