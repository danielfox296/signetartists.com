sections:
  - type: key_takeaways
    items:
      - "A picnic is the one company event where the entertainment has to work for families in the afternoon and for the crowd that stays into the evening, and those are two different bookings."
      - "In Colorado the afternoon weather decides the stage. Covered, level and dry, with power run to it, and a move-indoors call written before the day."
      - "The lists you find for a company picnic are games lists. Music is the missing idea, and it's the one that reaches the whole lawn at once."
      - "The picnic that turns into a party at dusk is one booking: an acoustic act through the afternoon, a band or a DJ when the sun goes down."

  - type: prose
    body: |
      The company picnic is planned in spring by the same person who planned
      the holiday party, with half the budget and twice the variables. It
      has to work for a six-year-old and for the sales team, in the sun and
      possibly in the rain, on a lawn where the nearest outlet is a hundred
      feet away. The lists that come back from a search are games lists. Music is
      the idea that reaches everyone on the lawn at once without asking
      anybody to queue for it, and it's the idea those lists leave out.

      Eight ways the day can run, with what each one needs from the
      weather, the power and the crowd.

  - type: subhead
    text: "The Americana band on the lawn"

  - type: prose
    body: |
      Acoustic guitar, fiddle, upright bass and drums, playing the Colorado
      songbook in the afternoon sun: the Grateful Dead and Tom Petty beside
      Nathaniel Rateliff and the Lumineers. It's the sound a Colorado lawn
      expects, it plays at a level a picnic table talks across, and it turns
      into a dance set when the sun goes down. The
      [Americana band page](https://signetartists.com/ensembles/americana-band/)
      has the builds and the outdoor requirements.

  - type: subhead
    text: "The acoustic duo by the food line"

  - type: prose
    body: |
      Voice and guitar playing covers people know at a volume they can talk
      across, set up where the crowd actually gathers, which at a picnic is
      within sight of the food. An [acoustic duo](https://signetartists.com/ensembles/acoustic-duo/)
      is the smallest real outdoor booking, and it fits an 8 by 6 foot
      corner of a pavilion on one circuit.

  - type: subhead
    text: "The DJ afternoon"

  - type: prose
    body: |
      The simplest to approve and the easiest to run: one line, one load-in,
      music from the first burger to the last raffle ticket, and an
      announcement microphone for the raffle. An
      [open-format DJ](https://signetartists.com/ensembles/dj/) reads a
      picnic crowd the way it reads a ballroom, families first, the floor
      later.

  - type: subhead
    text: "The yacht rock evening"

  - type: prose
    body: |
      When the picnic is really a summer party, a patio or a rooftop in July
      with the sun going down, the [yacht rock band](https://signetartists.com/ensembles/yacht-rock/)
      is the act: the Doobie Brothers, Steely Dan, Hall and Oates and Toto,
      sung in harmony with the saxophone out front, for a crowd that wants to
      sing every chorus. It pairs with a duo through the afternoon on the
      same contract.

  - type: subhead
    text: "The solo guitarist under the pavilion"

  - type: prose
    body: |
      For the smaller company or the department picnic, a
      [solo guitarist](https://signetartists.com/ensembles/solo-guitarist/)
      sets up in 6 by 4 feet under the pavilion roof on one circuit and plays
      the afternoon. It's the booking for forty people and a shelter, and
      the one that needs the least from the site.

  - type: subhead
    text: "Games and activities, and who they reach"

  - type: prose
    body: |
      Lawn games for adults, the inflatable for the kids, the tug of war, the
      cornhole bracket. They work, and they reach the people playing them. A picnic of two hundred has a
      dozen conversations going within minutes of the first arrival, and a
      game reaches the eight people in it. Music reaches the lawn. Run both,
      and let the music be the thing that ties the afternoon together.

  - type: subhead
    text: "The family hour and the evening after it"

  - type: prose
    body: |
      Most company picnics are two events with the same guest list. The
      afternoon belongs to families and needs music at talking level and a
      raffle mic. The evening belongs to the people who stayed and needs a
      floor. That's one booking here: an acoustic act or the Americana trio
      through the afternoon, and the same band with drums, the yacht rock
      band or the DJ when the sun goes down, on one contract and one load-in.
      The [corporate page](https://signetartists.com/corporate/) covers the
      contract and the paperwork.

  - type: subhead
    text: "What an outdoor stage needs in Colorado"

  - type: prose
    body: |
      A covered, level and dry performance area with power run to it, and a
      move-indoors call written before the day. Colorado afternoons turn
      fast, instruments and electronics both stop behaving in the wet, and a
      pavilion or a tent with a deck is the difference between a band and a
      band packing up early. The stage footprints and the circuits for
      every size are on the
      [technical page](https://signetartists.com/planners/technical/), and
      the outdoor rules in full are in
      [what changes when the reception is outdoors](https://signetartists.com/blog/outdoor-reception/).

