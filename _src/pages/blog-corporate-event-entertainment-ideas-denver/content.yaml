sections:
  - type: key_takeaways
    items:
      - "The people planning these evenings say the same two things everywhere: not another casino night, not another photo booth. Every idea below is measured against that."
      - "The formats that are winning ask the crowd to do something together. The ones fading ask the crowd to watch."
      - "A cover or jazz band for a corporate event runs {{market:us_corporate_band}} in this market, and the number moves on how many musicians and how many hours far more than on which act."
      - "Denver's corporate calendar has an after-party in it now: conferences at the convention center, galas at the hotels beside it, and the back half of the holiday party."

  - type: prose
    body: |
      The assignment arrives the same way every time. Somebody senior says the
      event needs entertainment this year, the word is always entertainment
      and never music, and by Thursday it belongs to whoever runs the office.
      The lists that come back from a search are national and undated.

      This one is written for Denver in 2026, and each idea comes with what
      it asks of the crowd, the size it needs and where it sits in the
      evening. The figure first: a cover or jazz band
      for a corporate event runs {{market:us_corporate_band}} in this market,
      and how figures like that are built is set out in
      [what live music costs for a corporate event](https://signetartists.com/blog/what-live-music-costs-corporate-event/).
      Where it lands for your evening is on the
      [pricing page](https://signetartists.com/pricing/).

  - type: subhead
    text: "Start with what the evening is for"

  - type: prose
    body: |
      Four things a company evening can be for, and the entertainment
      follows from which one you pick. A reception is for people meeting
      each other, so the act has to leave them able to talk. A dinner with a
      program is for honoring somebody, so the act has to know where the
      remarks are. A celebration is for a floor, so the act has to be loud
      at the right moment and not before. A conference after-party is for a
      crowd from six cities that spent the day in a ballroom, so the act has
      to reach all of them at once.

      Most evenings are two of these in sequence. The ideas below are
      grouped that way.

  - type: subhead
    text: "Live band karaoke"

  - type: prose
    body: |
      The idea for the office that has done the casino night. A real band
      plays the 80s and 90s hits on its own, sung out front, and hands the
      microphone to anyone who wants a song, with the words on a screen and a
      host on the floor. Nobody has to sing for the night to work. The band
      fills the set on its own and is ready the moment somebody gets brave,
      and the first volunteers are nearly always a pair or a group.

      What separates it from a karaoke machine is who is standing behind the
      singer. The tempo follows them, a second voice comes in on the chorus,
      and the song ends when it should. It plays a holiday party, a sales kickoff evening or a conference
      after-party as its own act or as the loud chapter of a longer night.
      The [live band karaoke page](https://signetartists.com/ensembles/live-band-karaoke/)
      has the songbook and the builds.

  - type: subhead
    text: "A DJ with a live musician over the set"

  - type: prose
    body: |
      The most common single corporate booking, and the simplest to approve.
      An [open-format DJ](https://signetartists.com/ensembles/dj/) reads a
      mixed crowd from the first song, and a saxophonist or a bassist on
      the floor over the set is the difference between a playlist and a crowd
      watching something happen. It's one line on the budget, one load-in, and
      the whole evening covered.

  - type: subhead
    text: "The jazz trio that gives people a reason to stop and talk"

  - type: prose
    body: |
      Ask a group of planners what to bring to a company party and the
      argument they make for a strolling magician is that guests get a reason
      to stop and talk to each other. A [jazz trio](https://signetartists.com/ensembles/jazz-duo-trio/)
      does that for the whole evening. Guitar, upright bass and drums played
      with brushes sit at 65 to 72 dBA at the nearest table, guests drift
      toward the musicians and carry the conversation back, and the evening has
      a middle to it that nobody had to organise. It's the reception act
      and the dinner act for the evening that's really about the talking.

  - type: subhead
    text: "A yacht rock band on the patio"

  - type: prose
    body: |
      The Doobie Brothers, Steely Dan, Hall and Oates, Toto and Christopher
      Cross, sung in harmony with the saxophone out front, for the summer
      party, the client appreciation evening on a terrace, or the late set
      once the awards are done. Denver has been searching for a
      [yacht rock band](https://signetartists.com/ensembles/yacht-rock/) for
      years and buying tickets to a touring one instead. It's the idea for a
      crowd that wants to sing every chorus.

  - type: subhead
    text: "The Colorado evening for guests who flew in"

  - type: prose
    body: |
      A group that came to Denver for a conference or an incentive trip wants
      one evening that could only have happened here, and a ballroom playlist
      is the same in every city. An [Americana band](https://signetartists.com/ensembles/americana-band/)
      on acoustic guitar, fiddle, upright bass and drums plays the songs
      people expect in the mountains, the Grateful Dead and Tom Petty, beside
      the songs written here, Nathaniel Rateliff and Gregory Alan Isakov. It
      plays a welcome reception downtown, a ranch dinner or the last night in
      Vail.

  - type: subhead
    text: "A soul and R&B floor after the awards"

  - type: prose
    body: |
      Stevie Wonder, Aretha Franklin, Al Green and the Motown book, sung out
      front with a horn on the choruses. This is the ballroom floor act for
      the evening with a program in front of it: the band plays dinner at
      conversation volume, goes silent for the remarks and the awards, and
      opens the dance floor on the emcee's last word. The soul and R&B band is on
      the [roster page](https://signetartists.com/music/), and the way the
      music works around a program is on the
      [galas and award nights page](https://signetartists.com/corporate/galas-and-awards/).

  - type: subhead
    text: "The flamenco set piece"

  - type: prose
    body: |
      Some evenings want one thing guests photograph and describe.
      [Dirty Flamenco](https://signetartists.com/ensembles/flamenco-trio/) is
      that booking: real palos played by a working flamenco trio, with a
      dancer when the night wants a floor show, placed where the program
      leaves space for it. It's the idea for the member event, the client
      dinner that should be remembered, and the party with a theme.

  - type: subhead
    text: "Solo piano through the reception"

  - type: prose
    body: |
      The hotel-bar hour before dinner, the client dinner for twenty, the
      awards reception in a ballroom foyer. It's one musician at the piano,
      playing standards and covers at a level the conversation sits on top of, with a voice
      added when the evening wants singing. It's the smallest idea on this
      list and the one planners ask for by name in their own threads.

  - type: subhead
    text: "The comedian, the magician and the casino table"

  - type: prose
    body: |
      Notes on the three ideas every list leads with. A comedian works
      when the crowd is seated, sober enough to listen and shares a
      vocabulary, which describes a client dinner and rarely describes a
      holiday party after the bar opens. A strolling magician works a
      reception well and asks nothing of anyone, which is exactly the
      argument for a trio, and the two do the same job. The casino table is
      the format the planners themselves are trying to escape this year; if
      you run one, run it as a side table.

      None of these is a music vendor's business, and we don't book them.

  - type: subhead
    text: "Why people want to be in the same place again"

  - type: prose
    body: |
      Something changed in what a company evening is for. The people who plan
      them describe a workforce that spends its days on calls and its evenings
      on a feed, and a party that could have been a video is a party nobody
      needed to attend. The events people talk about the next morning are the
      ones where something happened in the venue that couldn't be replayed:
      the accounting team on stage for a Bon Jovi song, a trio that made two
      people from different floors stop and talk, a floor that sang a chorus
      back at the band.

      That's the case for a live act over a screen, a playlist or a booth,
      and it's the case the planners are already making to each other in
      their own words: interactive, memorable, not something people watch.
      A band is the least fakeable thing you can put in an evening. It's
      happening once, for this crowd, and everyone in the venue knows it.

  - type: subhead
    text: "What changes with the headcount"

  - type: prose
    body: |
      Under about eighty guests, a duo or a solo musician carries the evening:
      an 8 by 6 foot footprint, one 20-amp circuit, an hour to load in.
      Between eighty and a hundred and fifty, the trio is the size to book,
      because drums played with brushes let the sound stay conversational
      while covering twice the floor. Above a hundred and fifty, a floor that
      has to fill needs a quartet or more, in 14 by 10 feet on two dedicated
      circuits, and a dinner set at conversation volume before the dancing starts.

      Two things go wrong at scale whatever you book. A large group breaks
      into a dozen conversations within minutes of arriving, so an idea that
      only reaches the people queuing for it reaches a small share of the
      guest list. And a hotel's house system is specified for speeches and
      won't carry a band across a ballroom, which is why sound support that's
      the right size for the venue is part of the booking here.

