<!-- The page's own close. The sitewide offer close is a buyer's block
     ("Check a Date"), and this page's action is the submission form. -->
<section class="section section--ruled">
  <div class="wrap">
    <div class="close-row">
      <div style="max-width: 32rem;">
        <h2 class="h2">Send us your act.</h2>
        <p class="lede">Links to video or audio, the sizes you offer and your typical rate for a three-hour event are what we need to start. We read every submission, and when there&rsquo;s a fit we&rsquo;ll write back and set up a call.</p>
      </div>
      <div class="btn-row"><a class="btn" href="{{form_artist}}">Send us your act</a></div>
    </div>
    <p class="note">If you&rsquo;d rather ask something first, email <a href="mailto:{{brand_email_raw}}">{{brand_email}}</a>.</p>
  </div>
</section>
