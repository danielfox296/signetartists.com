# ---------------------------------------------------------------------------
# Research series, drafted 2026-10-03. Evidence for the title: Google
# autocomplete (read 2026-10-03) suggests "does loud music make people drink
# more", "does loud music make you drink more", "does loud music make you
# more drunk" and "loud music and alcohol". The subheads are the reader's
# questions. Facts come only from the writer's fact sheet (V1 entries of
# research/music-behavior-2026-10/), each with its catch. Plain and calm:
# not HR advice, not a warning, no moralizing about alcohol. The 2008 bar
# study is reported with its problem, and its reference says the companion
# 2004 paper carries an expression of concern.
# THE ONE READER: whoever is hosting a company party, or any party with a
# bar, has heard that loud music makes people drink faster, and wants to
# know if it's true and what to do about the music.
# ---------------------------------------------------------------------------
title: "Does loud music make people drink more?"
seo_title: "Does loud music make people drink more? What the research shows"
slug: "does-loud-music-make-people-drink-more"
eyebrow: "RESEARCH"
parent: "corporate/holiday-party/"
dek: "What the studies on music and drinking found, how much weight each one can take, and what it means for the music at a company party."
date: "2026-10-03"
author:
  name: "Signet Artists"
meta_description: "Does loud music make people drink more? The best-known study is small and comes from a lab whose work is in question. Here's what the research shows."
llms_description: "A research summary from Signet Artists, a Denver live music booking company, on whether loud music makes people drink more. It covers the 2008 French study of 40 men in two bars behind the claim and why its evidence is in question (the same group's 2004 bar study carries an expression of concern, the lead author has had other papers retracted, and no other group has repeated the experiment in a bar), a 2013 lab study in which women finished a drink faster with music than in silence whatever the tempo, a 2012 lab study in which music made drinks taste sweeter, a study of 60 European bars in which loudness stopped predicting intoxication once other factors were accounted for, and acoustics research on the sound levels at which guests can still talk. It ends with practical guidance for the music at a company party: keep the talking part of the evening at a level people can talk across and let the dance floor be louder."

