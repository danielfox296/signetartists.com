sections:
  - type: key_takeaways
    items:
      - "Songs released when people were about 10 to 30 tend to feel the most personal. For a resident who's 80 in 2026, that's roughly 1956 to 1976."
      - "In a trial in San Francisco senior centers, six months of a weekly choir lowered loneliness and raised interest in life more than waiting did, though it didn't change memory, strength or symptoms of depression."
      - "The researchers studied people who sang in a group week after week, and none of the studies took place in memory care."

  - type: prose
    body: |
      A song starts in the common area, and one table at a time, people join
      in until most of the residents are singing the same chorus. If you're planning a sing-along for older adults,
      picking songs everyone already knows is the place to start.

  - type: subhead
    text: "Which songs work for a senior sing-along?"

  - type: prose
    body: |
      These all come from our own
      [song list](https://signetartists.com/repertoire/) and from our senior
      living sets, grouped by kind.

      **The standards.** Our musicians play Autumn Leaves, All of Me, Someday
      My Prince Will Come and The Girl from Ipanema for residents.

      **The Beatles.** Our Beatles sing-along plays Hey Jude, Let It Be,
      Yesterday, Blackbird, Come Together, Eleanor Rigby, A Hard Day's Night,
      Something, While My Guitar Gently Weeps, Rocky Raccoon and Mother
      Nature's Son.

      **Motown and soul.** Our song list has My Girl, Respect, Lean on Me,
      Stand By Me and (Sittin' On) The Dock of the Bay.

      **The sixties and seventies.** Sweet Caroline, Brown Eyed Girl, Bad
      Moon Rising, Have You Ever Seen the Rain and Take It Easy are all on
      the song list, too.

      **Country and folk.** There's also Ring of Fire, Thank God I'm a
      Country Boy and Take Me Home, Country Roads.

  - type: subhead
    text: "How do you choose songs for your residents?"

  - type: prose
    body: |
      It helps to start with the years they were young. In a 2024 study of
      112 older adults rating songs from the 1950s to the 1980s, the songs
      that felt most personal were the ones released
      when the listener was between about 10 and 30. Researchers in a larger
      2025 study, of 1,891 people, put the peak for personally meaningful
      songs at age 17.

      By our arithmetic, for a resident who's 80 in 2026, those years are
      roughly 1956 to 1976, and for a resident who's 90 they're roughly 1946
      to 1966. It's also worth asking residents and their families which
      songs they love, since any one person may have favorites from a
      different decade.

      How a song is sung seems to matter as well. Researchers in the north of
      England counted how much people sang along to 1,054 songs across 30
      nights in five venues, and found that people sang along more to songs
      sung in a full voice with clear words. Those were nights out rather
      than afternoons in a senior community, but it's still a good reason to
      have someone leading the singing who sings the words out clearly.

  - type: subhead
    text: "Is singing together good for older adults?"

  - type: prose
    body: |
      In two trials of weekly singing groups for older adults, a few things
      improved, though not everything the researchers were looking for.

      In San Francisco, 12 senior centers were assigned at random either to
      start a choir straight away or to wait six months. In all, 390 people
      took part, with an average age of 71, and the choirs met weekly for 90
      minutes with professional choir directors. After six months,
      loneliness had fallen and interest in life had risen more in the choir
      group than in the centers that waited. The researchers found no change
      in thinking and memory, physical strength or symptoms of depression,
      which were the things the trial had mainly set out to improve.

      In England, 258 people aged 60 and over were assigned at random to
      community singing groups or to carry on as usual. At six months, the
      singers scored a little better on a measure of mental wellbeing. Their
      gains had been bigger at three months and had partly faded by six.

      Singing also seemed to bring a new group together faster in a 2015
      British study. Researchers followed 135 adults, aged 18 to 83, in new
      adult-education classes, and the people in singing classes felt closer
      to their classmates after the first month than the people in craft and
      writing classes did. The other classes caught up by the third month.

      The catch is that all three looked at people who sang in a group week
      after week, rather than on a single afternoon, and none of them was
      done in memory care.

  - type: subhead
    text: "What a sing-along with us looks like"

  - type: prose
    body: |
      Our [Beatles sing-along](https://signetartists.com/ensembles/beatles-sing-along/),
      Your Bird Can Sing, is two musicians who play the Beatles and lead the
      singing. Everyone gets a lyric booklet, so a resident who doesn't
      remember the second verse can read along, and anyone who'd rather sit
      and listen is welcome to. It's about as loud as a conversation, and in
      a small space it can play with no amplification at all. In memory
      care, the same duo usually plays a shorter, quieter set for a smaller
      group.

      If your residents would rather sing Motown, folk and country songs, a
      singer with a guitar can lead those instead. Either one can come once,
      or on a standing afternoon every month or every other week, with the
      set changing from visit to visit. Find out more about booking music for
      residents on our
      [senior living page](https://signetartists.com/daytime/senior-living/).

