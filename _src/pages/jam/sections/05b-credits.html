<!-- The site's client strip, the same block the home page and the hubs
     carry (site.json credits, build.py inlines the marks). For a venue
     owner it is the proof that the outfit behind the night is real. -->
<section class="section section--ruled section--sunk credits" aria-label="Where our artists have played">
  <div class="wrap">
    {{credits}}
    <p class="note credits-also">{{credits_also}}</p>
  </div>
</section>
