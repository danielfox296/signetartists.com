<!-- Signet Jam, 2026-09-16. Page-scoped rules, every class prefixed jam-.
     Everything else is the site's own system: .wrap, .section and its grain
     bands, .eyebrow and the one brass slab, .h1/.h2 in condensed caps, .btn,
     Archivo. The page pins three sections with GSAP (08-script.html); this
     stylesheet is the plain vertical stack, which is what reduced motion, a
     blocked CDN and every crawler get, and the `jam-motion` class on <html>
     switches the pinned layouts on. -->
<style>
/* Icons: one sprite (below), line icons on the 24 grid, brass, 1.5 stroke. */
.jam-ico { display: block; width: 1.5rem; height: 1.5rem; fill: none; stroke: currentColor; stroke-width: 1.5; stroke-linecap: round; stroke-linejoin: round; }

/* Section index labels: the handoff's "02 / The night", as the site eyebrow. */
.jam-idx span { color: var(--ink-faint); margin-right: 0.6rem; font-variant-numeric: tabular-nums; }

/* ---------------------------------------------------------------- 01 hero */
.jam-hero { padding-top: var(--space-4); padding-bottom: var(--space-5); }
.jam-hero__grid { display: grid; gap: var(--space-4); align-items: center; }
.jam-venue {
  margin-top: 1rem;
  font-size: clamp(1.25rem, 1rem + 1.2vw, 1.875rem);
  line-height: 1.2;
  color: var(--ink-soft);
}
/* The sign-up sheet, half full. Drawn, not photographed: the one image on
   the page, in the palette, and it is the object the copy keeps coming back
   to. Brass is spent on the signatures. */
.jam-sheet { width: 100%; max-width: 19rem; }
.jam-sheet svg { display: block; width: 100%; height: auto; overflow: visible; }
.jam-sheet__paper { fill: var(--paper-sunk); stroke: var(--rule-strong); stroke-width: 1.5; }
.jam-sheet__rule { stroke: var(--rule-strong); stroke-width: 1.5; }
.jam-sheet__line { stroke: var(--rule); stroke-width: 1.5; }
.jam-sheet__num { font-family: var(--sans); font-size: 11px; letter-spacing: 0.06em; fill: var(--ink-faint); }
.jam-sheet__head { font-family: var(--display); font-weight: 800; font-stretch: 72%; font-size: 22px; text-transform: uppercase; fill: var(--ink); }
.jam-sheet__sig { fill: none; stroke: var(--brass); stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
@media (min-width: 860px) {
  .jam-hero__grid { grid-template-columns: minmax(0, 1.2fr) minmax(0, 0.8fr); }
  .jam-sheet { justify-self: end; max-width: 21rem; }
}

/* ------------------------------------------------------------ 02 the night */
.jam-night { position: relative; overflow: hidden; }
.jam-night .wrap { position: relative; }
.jam-night__block { position: relative; margin-top: var(--space-4); max-width: 40rem; padding-left: 4.25rem; }
.jam-night__line {
  position: relative;
  margin: 0 0 1.1em;
  font-size: clamp(1.375rem, 1.05rem + 1.4vw, 2.125rem);
  font-weight: 500;
  line-height: 1.25;
  letter-spacing: -0.005em;
  color: var(--ink);
  text-wrap: pretty;
}
.jam-night__line:last-child { margin-bottom: 0; }
/* The set-list numeral and the brass dash, the site's own list marker. */
.jam-num {
  position: absolute;
  left: -4.25rem;
  top: 0.55em;
  display: flex;
  align-items: center;
  gap: 0.6rem;
  font-size: 0.75rem;
  font-weight: 500;
  letter-spacing: var(--track-caps);
  color: var(--brass);
  font-variant-numeric: tabular-nums;
}
.jam-num::after { content: ""; width: 1rem; height: 1px; background: var(--brass); }
.jam-mask { display: none; position: absolute; left: 0; right: 0; z-index: 2; pointer-events: none; }
.jam-mask--top { top: 0; height: 30%; background: linear-gradient(to bottom, #0a0906 0, #0a0906 5.5rem, transparent 100%); }
.jam-mask--bot { bottom: 0; height: 22%; background: linear-gradient(to top, #0a0906, transparent); }
@media (max-width: 479px) {
  .jam-night__block { padding-left: 0; }
  .jam-num { position: static; margin-bottom: 0.5rem; }
}

/* ------------------------------------------------- 03 who's in the building */
.jam-cast { overflow: hidden; }
.jam-track-wrap {
  margin-top: var(--space-4);
  overflow-x: auto;
  overflow-y: hidden;
  -webkit-overflow-scrolling: touch;
  scrollbar-width: thin;
  scrollbar-color: var(--rule-strong) transparent;
  padding-bottom: 1rem;
}
.jam-track-wrap::-webkit-scrollbar { height: 6px; }
.jam-track-wrap::-webkit-scrollbar-track { background: var(--rule); }
.jam-track-wrap::-webkit-scrollbar-thumb { background: var(--rule-strong); }
/* The track's left edge is the wrap's content edge, so the first card lines
   up under the section label. */
.jam-track {
  display: flex;
  width: max-content;
  padding-left: max(1.5rem, calc((100% - 64rem) / 2));
  padding-right: max(1.5rem, calc((100% - 64rem) / 2));
  will-change: transform;
}
.jam-card {
  flex: 0 0 auto;
  width: clamp(15rem, 23vw, 18.5rem);
  margin-left: -1px;
  padding: 1.5rem;
  background: var(--paper);
  border: 1px solid var(--rule);
}
.jam-card:first-child { margin-left: 0; }
.jam-card .jam-ico { width: 2rem; height: 2rem; color: var(--brass); }
.jam-card__role {
  margin-top: 2.5rem;
  font-family: var(--display);
  font-weight: 800;
  font-stretch: 72%;
  font-size: 1.125rem;
  line-height: 1.05;
  text-transform: uppercase;
  color: var(--ink);
}
.jam-card p { margin-top: 0.6rem; font-size: 0.9375rem; line-height: 1.6; color: var(--ink-soft); }
.jam-progress { display: none; height: 1px; margin: var(--space-3) auto 0; max-width: 64rem; background: var(--rule); }
.jam-progress i { display: block; height: 100%; background: var(--brass); transform-origin: left center; transform: scaleX(0); }
@media (max-width: 759px) { .jam-card { width: min(78vw, 20rem); } }

/* ---------------------------------------------------- 04 what it turns into */
.jam-turns { overflow: hidden; }
/* The timeline: a rule with the three marks the states sit on; brass fills it
   across the pin. */
.jam-timeline { position: relative; display: none; margin-top: var(--space-3); height: 1px; background: var(--rule); }
.jam-timeline b { position: absolute; inset: 0; background: var(--brass); transform-origin: left center; transform: scaleY(1) scaleX(0); }
.jam-timeline i { position: absolute; top: -3px; width: 1px; height: 7px; background: var(--rule-strong); }
.jam-timeline .t0 { left: 0; }
.jam-timeline .t1 { left: 36%; }
.jam-timeline .t2 { left: 70%; }
.jam-states { margin-top: var(--space-4); }
.jam-state { display: grid; gap: var(--space-2); align-items: start; }
.jam-state + .jam-state { margin-top: var(--space-4); padding-top: var(--space-4); border-top: 1px solid var(--rule); }
.jam-figure {
  font-family: var(--display);
  font-weight: 800;
  font-stretch: 72%;
  font-size: clamp(5rem, 3rem + 9vw, 11rem);
  line-height: 0.85;
  letter-spacing: -0.01em;
  color: var(--ink);
  font-variant-numeric: tabular-nums;
}
.jam-figure small {
  display: block;
  margin-top: 0.75rem;
  font-family: var(--sans);
  font-size: 0.75rem;
  font-weight: 500;
  line-height: 1;
  letter-spacing: var(--track-caps);
  text-transform: uppercase;
  color: var(--ink-faint);
}
.jam-state .eyebrow { margin-top: 0.25rem; }
.jam-prose {
  margin-top: 0.75rem;
  max-width: 34rem;
  font-size: clamp(1.125rem, 1rem + 0.6vw, 1.375rem);
  line-height: 1.5;
  color: var(--ink-soft);
  text-wrap: pretty;
}
@media (min-width: 760px) {
  .jam-state { grid-template-columns: minmax(0, 0.38fr) minmax(0, 0.62fr); gap: var(--space-4); }
}

/* ------------------------------------------------------ 05 who's running it */
.jam-host { display: grid; gap: var(--space-3); margin-top: var(--space-4); }
.jam-host__ico { width: 5.5rem; height: 5.5rem; color: var(--brass); }
.jam-host__text { max-width: 40rem; font-size: 1.125rem; line-height: 1.65; color: var(--ink-soft); }
.jam-host .wordmark { display: block; margin-top: var(--space-3); color: var(--ink-faint); }
@media (min-width: 760px) { .jam-host { grid-template-columns: 8rem minmax(0, 1fr); gap: var(--space-4); } }

/* ---------------------------------------------------------- 06 how it works */
.jam-how .h2 { margin-top: 0.75rem; max-width: 22ch; }
.jam-ledger { margin-top: var(--space-4); display: grid; gap: 1px; border: 1px solid var(--rule); background: var(--rule); }
.jam-ledger__col { padding: 1.75rem; background: var(--paper); }
.jam-ledger__col .eyebrow { margin-bottom: 0.5rem; }
.jam-ledger__row { display: flex; align-items: flex-start; gap: 0.875rem; padding: 0.8rem 0; border-bottom: 1px solid var(--rule); }
.jam-ledger__row:last-child { border-bottom: 0; padding-bottom: 0; }
.jam-ledger__row .jam-ico { flex: 0 0 auto; width: 1.375rem; height: 1.375rem; margin-top: 0.1rem; color: var(--brass); }
.jam-ledger__row p { font-size: 0.9375rem; line-height: 1.55; color: var(--ink-soft); }
.jam-closing { display: grid; gap: var(--space-2); align-items: center; margin-top: var(--space-4); padding-top: var(--space-3); border-top: 1px solid var(--rule); }
.jam-closing .jam-figure { font-size: clamp(4rem, 3rem + 4vw, 6.5rem); }
.jam-closing__line { font-size: clamp(1.375rem, 1.1rem + 1.2vw, 2rem); font-weight: 500; line-height: 1.25; letter-spacing: -0.005em; color: var(--ink); max-width: 18ch; text-wrap: balance; }
@media (min-width: 760px) {
  .jam-ledger { grid-template-columns: 1fr 1fr; }
  .jam-closing { grid-template-columns: auto minmax(0, 1fr); gap: var(--space-4); }
}

/* -------------------------------------------------------------- 07 close */
.jam-close .h2 { margin-top: 0.75rem; max-width: 14ch; }
.jam-close .btn-row { align-items: center; }

/* ---------------------------------------------------------- motion states */
/* jam-motion: GSAP loaded and motion allowed. The three pinned sections take
   the viewport below the sticky header; --jam-hdr is measured by the script. */
.jam-motion .jam-pin { height: calc(100vh - var(--jam-hdr, 0px)); height: calc(100svh - var(--jam-hdr, 0px)); display: flex; flex-direction: column; }
/* .wrap is content-box with 1.5rem side padding; as a flex item with auto
   margins it would shrink to its eyebrow, so give it the full width back. */
.jam-motion .jam-pin > .wrap { width: calc(100% - 3rem); }
.jam-motion .jam-night .wrap { flex: 1 1 auto; }
.jam-motion .jam-night__block { position: absolute; top: 34%; left: 1.5rem; right: 1.5rem; margin-top: 0; }
.jam-motion .jam-mask { display: block; }
.jam-motion .jam-cast .jam-track-wrap { margin-top: auto; margin-bottom: auto; }
.jam-motion .jam-track-wrap { overflow: hidden; padding-bottom: 0; }
.jam-motion .jam-progress { display: block; }
.jam-motion .jam-timeline { display: block; }
.jam-motion .jam-states { display: grid; }
.jam-motion .jam-state { grid-area: 1 / 1; }
.jam-motion .jam-state + .jam-state { margin-top: 0; padding-top: 0; border-top: 0; }
</style>
