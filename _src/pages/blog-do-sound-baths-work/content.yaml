# Research series, 2026-10-03. Evidence for the title: Google suggests "do
# sound baths work", "do sound baths really work", "sound bath benefits
# scientifically proven", "sound bath benefits science", "are sound baths
# legit", "are sound baths good for you", "do recorded sound baths work"
# (read 2026-10-03). The approved frame: people report feeling calmer and
# less tense afterwards, small studies back that up, no health claim is
# supported, and the post says how thin the evidence is even though we book
# the session. Every study, number and quote comes from the verified fact
