title: "Do sound baths work?"
seo_title: "Do sound baths work? What the science says so far"
slug: "do-sound-baths-work"
eyebrow: "RESEARCH"
parent: "daytime/sound-bath/"
dek: "What the studies of singing bowls and sound meditation have found, how small they are, what the reviews conclude, and what a sound bath can reasonably offer a team or a group."
date: "2026-10-03"
author:
  name: "Signet Artists"
meta_description: "Do sound baths work? People report feeling calmer and less tense, and small studies agree, but no health benefit is proven. Here's what the research says."
llms_description: "A summary of the research on sound baths from Signet Artists, a Denver booking company whose roster includes a sound bath. A 2017 observational study of 62 adults with no control group found less tension, anger, fatigue and low mood after sound meditations of about an hour on singing bowls, gongs and bells. A 2023 randomized trial of 50 anxious adults found that one session of singing bowls and one session of muscle relaxation both lowered anxiety compared with a waiting list, the bowls a little more, with about 17 people per group. A 2020 study of 48 adults found people felt slightly less sleepy after a struck bowl while a pupil measure of sleepiness showed no difference. A 2020 review found four studies and could not recommend singing bowl therapies; a 2025 review of 19 studies of mixed quality said they may have potential for anxiety, low mood and sleep. No study found shows a sound bath treats any condition. What a sound bath offers is an hour or so of rest, and people often say they feel calmer afterwards."

