{# One accent on this site (brass), so no per-stat accent variants; an
   authored block.accent is tolerated and ignored. #}
<div class="blog-stat">
  <div class="blog-stat-number">{{ block.number }}</div>
  <div class="blog-stat-label">{{ block.label }}</div>
  <div class="blog-stat-source">{{ block.source }}</div>
</div>
