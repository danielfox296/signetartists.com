  - id: "2026-10-15-linkedin-january-open"
    channel: linkedin
    publish_at: "2026-10-15T08:45:00-06:00"
    pillar: calendar
    campaign: january-2027
    status: draft
    brief: >
      TRACK B OPENS. The single most important post of the plan. Plant January
      while people are still choosing December, and frame it as the better
      evening rather than the consolation prize.
    link: "https://signetartists.com/blog/january-office-party-ideas/?utm_source=linkedin&utm_medium=social&utm_campaign=january-2027"
    body: |
      A growing number of companies have moved the office holiday party to
      January, and Denver's venues have already followed. Several now write
      their holiday packages to run from the middle of November into the third
      week of January and past it.

      The planners who moved it say the same two things about why.

      December belongs to everybody else. Your party competes with three other
      invitations, a school concert and a flight home. And the person who
      organised it spends December organising it instead of attending anything.

      Move the date past the new year and the evening becomes the only thing on
      the calendar that week. The venue has dates. And the planner gets to enjoy
      the night they built.

      Nothing about the music changes. Standards, covers and a dance set were
      never seasonal, so a January party books exactly the same acts a December
      one does. The formats that want the crowd's attention, live band karaoke
      most of all, get more of it in January than they ever get in December.

      If your December date fell through, this is not a downgrade. Ask the
      people who did it last year which party had better attendance.

      Seven formats and the themes that do not need a tree, link below.
    first_comment: "The full write-up: https://signetartists.com/blog/january-office-party-ideas/?utm_source=linkedin&utm_medium=social&utm_campaign=january-2027"

