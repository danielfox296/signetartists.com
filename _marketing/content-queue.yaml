# ---------------------------------------------------------------------------
# Signet Artists social content queue
#
# THE SUBSTANCE OF EVERY POST IS WRITTEN BY A PERSON. Nothing in this file is
# generated. The automation reads this file, validates it and publishes what is
# due. It never writes a body.
#
# How a week runs
#   1. Fill in `body` for the slots whose `status` is `brief`
#   2. python3 scripts/social_queue.py --lint
#   3. Set `status: ready`, commit, push
#   4. .github/workflows/social.yml publishes each post at `publish_at`
#
# Fields
#   id          unique, YYYY-MM-DD-<channel>-<slug>
#   channel     linkedin | linkedin-personal | instagram | manual
#               `linkedin`          the company page. Needs the partner-gated
#                                   Community Management API, so it waits on
#                                   LinkedIn's review.
#               `linkedin-personal` Daniel's own profile, via self-serve
#                                   w_member_social. Available immediately and
#                                   the higher-reach surface, so most LinkedIn
#                                   slots should be this until the Page clears.
#               `manual`            a person posts it by hand. Instagram
#                                   Stories only.
#   publish_at  ISO 8601 with offset. Denver is -06:00 (MDT) until 2026-11-01
#               and -07:00 (MST) after it. Get this wrong and a post lands an
#               hour off, which nobody will notice, so it is not worth agonising
#               over.
#   pillar      calendar | floor | paperwork | acts | proof   (see the strategy)
#   campaign    holiday-2026 | january-2027 | always-on
#   status      brief | draft | ready | published | skipped
#               Only `ready` publishes. `brief` and `draft` are ignored by the
#               workflow and are the normal state of most of this file.
#   brief       what this slot is for. Written ahead, by a person, as a prompt
#               for the person who fills it in
#   body        the post itself. Required for `ready`
#   media       repo-relative image paths or a YouTube URL. Optional on
#               LinkedIn, required on Instagram
#   link        destination with UTMs. Required for `ready` on LinkedIn
#   first_comment  optional. LinkedIn suppresses posts with outbound links, so
#               the link often does better in the first comment
#
# Standing rules, enforced by scripts/social_queue.py
#   no prices, no percentages, no availability claims, no em dashes,
#   no "AI", no "chair", no "room" except ballroom and green room,
#   no business filler. See _marketing/BRAND-SOCIAL-STRATEGY.md section 2.
# ---------------------------------------------------------------------------

meta:
  timezone: "America/Denver"
  utm_medium: "social"
  campaigns:
    holiday-2026:
      utm_campaign: "holiday-2026"
      live: "2026-09-22 to 2026-12-05"
      hook: "The one they still talk about in February."
    january-2027:
      utm_campaign: "january-2027"
      live: "2026-10-15 to 2027-01-15"
      hook: "The party everybody actually comes to."
    always-on:
      utm_campaign: "always-on"

posts:

