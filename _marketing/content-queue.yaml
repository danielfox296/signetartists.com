  - id: "2026-09-22-linkedin-booking-window"
    channel: linkedin
    publish_at: "2026-09-22T09:00:00-06:00"
    pillar: calendar
    campaign: holiday-2026
    status: draft
    brief: >
      Season opener. Useful, dated, true, and asks for nothing. Calendar fact
      only: no availability, no figures. This is the post that says we are
      back, without saying we are back.
    link: "https://signetartists.com/corporate/holiday-party/?utm_source=linkedin&utm_medium=social&utm_campaign=holiday-2026"
    body: |
      Denver corporate holiday parties get decided between August and October.

      That is not a sales line, it is just when the venues go. If you are the
      person who ended up responsible for this year's party, here is the order
      that saves the most trouble.

      Venue first. Then headcount. Then your run of show. Then the music.

      Most planners do the music last anyway, and that is fine. The part worth
      doing early is telling whoever you hire what time the speeches are. A band
      that knows the programme can play dinner at conversation volume, go silent
      while your CEO walks to the microphone, and get loud the moment the
      programme ends. A band that finds out on the night cannot.

      December Fridays and Saturdays go first. Thursdays stay open longest and
      are underrated, because on a Thursday your people are not choosing between
      your party and three others.

      New Year's Eve is its own animal and books earliest of all.

      We are a Denver corporate entertainment company. Bands, small ensembles, a
      DJ and live band karaoke, all on one contract. Our musicians have played
      for Amazon, NBCUniversal, Charles Schwab and the Denver Art Museum.

      Every November and December date is laid out on the season page, link
      below.
    first_comment: "Season page, with every November and December date: https://signetartists.com/corporate/holiday-party/?utm_source=linkedin&utm_medium=social&utm_campaign=holiday-2026"

